<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문화의집 소소책방 - 내 정보</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=book" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        body, input, button, a { font-family: 'Pretendard', sans-serif !important; font-weight: 300; }
        .dashboard-container { display: flex; min-height: 100vh; background-color: #F5F3EE; }
        .sidebar { background-color: #2C2621; color: #FFFFFF; width: 260px; padding: 30px 20px; box-sizing: border-box; }
        .brand { display: flex; align-items: center; gap: 8px; color: #FF5A36; font-size: 20px; margin-bottom: 40px; padding-left: 10px; }
        .sidebar-menu { list-style: none; padding: 0; }
        .sidebar-menu a { display: flex; align-items: center; gap: 12px; color: #A69E96; text-decoration: none; padding: 14px 16px; border-radius: 8px; }
        .sidebar-menu li.active a { background-color: #3D352E; color: #FFFFFF; }
        .main-content { flex: 1; padding: 40px; }
        .profile-wrapper { max-width: 600px; background: #FFFFFF; border: 1px solid #E6E2D8; border-radius: 12px; padding: 35px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: #5C5247; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #E6E2D8; border-radius: 8px; box-sizing: border-box; }
        .btn-update { background-color: #FF5A36; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="brand"><span class="material-symbols-outlined">book</span> <span>소소책방</span></div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-home"></i> 홈</a></li>
                <li class="active"><a href="profile.html"><i class="fas fa-user-cog"></i> 내 정보</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <header class="page-header">
                <h1>회원 정보 관리</h1>
            </header>
            <div class="profile-wrapper">
                <form id="profileForm" onsubmit="return false;">
                    <div class="form-group">
                        <label for="infoUserId">아이디 (이메일)</label>
                        <input type="email" id="infoUserId" disabled>
                    </div>
                    <div class="form-group">
                        <label for="infoName">이름</label>
                        <input type="text" id="infoName">
                    </div>
                    <div class="form-group">
                        <label for="infoPhone">연락처</label>
                        <input type="text" id="infoPhone" placeholder="010-XXXX-XXXX">
                    </div>
                    <div class="form-group">
                        <label for="infoPassword">새 비밀번호</label>
                        <input type="password" id="infoPassword" placeholder="변경할 새 비밀번호">
                    </div>
                    <div class="form-group">
                        <label for="profilePasswordConfirm">새 비밀번호 확인</label>
                        <input type="password" id="profilePasswordConfirm" placeholder="비밀번호 확인">
                    </div>
                    <button type="submit" class="btn-update" id="btnUpdateProfile">회원 정보 수정하기</button>
                </form>
            </div>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard-user.js"></script>
</body>
</html>
