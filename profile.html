<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문화의집 소소책방 - 내 정보</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=book" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <style>
        body, input, button, a { font-family: 'Pretendard', sans-serif !important; font-weight: 300; }
        .dashboard-container { display: flex; min-height: 100vh; background-color: #F5F3EE; }
        
        /* 사이드바 스타일 싱크 유지 */
        .sidebar { background-color: #2C2621; color: #FFFFFF; width: 260px; padding: 30px 20px; box-sizing: border-box; display: flex; flex-direction: column; }
        .sidebar .brand { display: flex; align-items: center; gap: 8px; color: #FF5A36; font-size: 20px; font-weight: 400; margin-bottom: 40px; padding-left: 10px; }
        .sidebar .brand .material-symbols-outlined { font-size: 28px; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu li { margin-bottom: 8px; }
        .sidebar-menu a { display: flex; align-items: center; gap: 12px; color: #A69E96; text-decoration: none; padding: 14px 16px; border-radius: 8px; font-size: 15px; transition: all 0.2s; }
        .sidebar-menu li.active a, .sidebar-menu a:hover { background-color: #3D352E; color: #FFFFFF; font-weight: 400; }
        .sidebar-menu li.active a i { color: #FF5A36; }
        
        /* 메인 콘텐츠 */
        .main-content { flex: 1; padding: 40px; box-sizing: border-box; }
        .page-header { margin-bottom: 30px; }
        .page-header h1 { font-size: 24px; color: #2C2621; margin: 0 0 6px 0; font-weight: 400; }
        .page-header p { color: #8C8276; margin: 0; font-size: 14px; }

        /* 프로필 카드 및 폼 레이아웃 */
        .profile-wrapper {
            max-width: 600px;
            background: #FFFFFF;
            border: 1px solid #E6E2D8;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 4px 15px rgba(44, 38, 33, 0.01);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #5C5247;
            margin-bottom: 8px;
            font-weight: 400;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #E6E2D8;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            color: #2C2621;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: #FF5A36;
        }

        .form-group input:disabled {
            background-color: #F5F3EE;
            color: #A69E96;
            cursor: not-allowed;
        }

        .btn-update {
            background-color: #FF5A36;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 400;
            margin-top: 15px;
            transition: background-color 0.2s;
        }

        .btn-update:hover {
            background-color: #E04F2F;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- 사이드바 네비게이션 -->
        <aside class="sidebar">
            <div class="brand">
                <span class="material-symbols-outlined">book</span>
                <span>소소책방</span>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-home"></i> 홈 (대시보드)</a></li>
                <li><a href="rent-books.html"><i class="fas fa-book-open"></i> 도서 대여</a></li>
                <li><a href="book-location.html"><i class="fas fa-map-marked-alt"></i> 도서 위치</a></li>
                <li><a href="rent-status.html"><i class="fas fa-list-ul"></i> 대여 현황</a></li>
                <li class="active"><a href="profile.html"><i class="fas fa-user-cog"></i> 내 정보</a></li> <!-- 현재 활성화 -->
            </ul>
        </aside>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <header class="page-header">
                <h1>회원 정보 관리</h1>
                <p>소소책방에 등록된 회원님의 소중한 정보를 확인하고 수정할 수 있습니다.</p>
            </header>

            <div class="profile-wrapper">
                <form id="profileForm" onsubmit="return false;">
                    <!-- 아이디 (수정 불가) -->
                    <div class="form-group">
                        <label for="profileId">아이디 (이메일)</label>
                        <input type="email" id="profileId" value="soso@bookhouse.com" disabled>
                    </div>

                    <!-- 이름 (수정 불가) -->
                    <div class="form-group">
                        <label for="profileName">이름</label>
                        <input type="text" id="profileName" value="홍길동" disabled>
                    </div>

                    <!-- 연락처 -->
                    <div class="form-group">
                        <label for="profilePhone">연락처</label>
                        <input type="text" id="profilePhone" placeholder="010-XXXX-XXXX" value="010-1234-5678">
                    </div>

                    <!-- 비밀번호 변경 -->
                    <div class="form-group">
                        <label for="profilePassword">새 비밀번호</label>
                        <input type="password" id="profilePassword" placeholder="변경할 새 비밀번호를 입력하세요.">
                    </div>

                    <div class="form-group">
                        <label for="profilePasswordConfirm">새 비밀번호 확인</label>
                        <input type="password" id="profilePasswordConfirm" placeholder="새 비밀번호를 다시 입력하세요.">
                    </div>

                    <!-- 정보 수정 버튼 -->
                    <button type="submit" class="btn-update" id="btnUpdateProfile">회원 정보 수정하기</button>
                </form>
            </div>
        </main>
    </div>

    <div id="toastContainer"></div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
