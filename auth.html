<div class="card">
  <h2>📚 도서 대출 시스템</h2>

  <input id="id" placeholder="아이디">
  <input id="pw" type="password" maxlength="4" placeholder="비밀번호 (4자리 숫자)">

  <button onclick="login()">로그인</button>

  <hr>

  <h3>회원가입</h3>
  <input id="r_id" placeholder="아이디">
  <input id="r_pw" type="password" maxlength="4" placeholder="비밀번호 4자리">
  <input id="r_name" placeholder="이름">
  <input id="r_phone" placeholder="전화번호">

  <button onclick="register()">가입</button>
</div>
