<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문화의집 소소책방 도서 대여</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=logout,person" />
    <style>
        /* [공통] 레이아웃 및 가독성 - 웜 베이지 테마 최적화 */
        .dashboard-layout { display: flex; min-height: 100vh; background-color: #FDFBF7; }
        .sidebar { width: 260px; background-color: #2C2621; color: #FFFFFF; padding: 30px 20px; flex-shrink: 0; }
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .top-header { display: flex; justify-content: space-between; align-items: center; padding: 25px 40px; background-color: transparent; }
        .content-wrapper { padding: 0 40px; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .card { width: 100%; margin-bottom: 24px; background: #FFFFFF; border-radius: 16px; border: 1px solid #E6E2D8; box-shadow: 0 4px 20px rgba(44, 38, 33, 0.02); overflow: hidden; }
        .card-header { padding: 20px 24px; border-bottom: 1px solid #E6E2D8; display: flex; justify-content: space-between; align-items: center; }
        .card-header h3 { font-size: 18px; color: #2C2621; font-weight: 700; }

        /* [사이드바 디자인] */
        .sidebar-logo { font-size: 22px; font-weight: 800; color: #FF5A36; margin-bottom: 40px; text-align: center; letter-spacing: -0.5px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 14px 18px; color: #8C8276; text-decoration: none; border-radius: 10px; font-weight: 500; margin-bottom: 8px; transition: all 0.2s; }
        .nav-item:hover { background-color: rgba(255, 255, 255, 0.05); color: #FFFFFF; }
        .nav-item.active { background-color: #FF5A36; color: #FFFFFF; font-weight: 600; }
        .nav-item i { width: 20px; text-align: center; }

        /* [헤더 및 유저 정보] */
        .user-info { font-size: 14px; color: #8C8276; font-weight: 500; display: flex; align-items: center; gap: 12px; }
        .user-info span { color: #2C2621; font-weight: 700; }
        #btnLogout { background-color: #8C8276; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .material-symbols-outlined { font-size: 20px; font-variation-settings: 'wght' 300; vertical-align: middle; }

        /* [표 스타일] */
        .data-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .data-table th { background-color: #F5F3EE; color: #2C2621; font-weight: 600; font-size: 14px; padding: 16px 14px; text-align: left; }
        .data-table tr { border-bottom: 1px solid #E6E2D8; }
        .data-table td { padding: 16px 14px; font-size: 14px; color: #2C2621; }
        .data-table th:nth-child(2), .data-table td:nth-child(2) { width: 100px; text-align: center; }
        .data-table th:nth-child(5), .data-table td:nth-child(5) { text-align: center; }

        /* [필터 및 기타 컨트롤] */
        .search-filter-container { display: flex; gap: 10px; }
        .search-filter-container input { padding: 10px 16px; border: 1px solid #E6E2D8; border-radius: 8px; font-size: 14px; width: 240px; }
        .filter-select { padding: 0 12px; border: 1px solid #E6E2D8; border-radius: 8px; font-size: 14px; background-color: #FFFFFF; cursor: pointer; }
        
        /* [내 정보 폼] */
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #2C2621; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #E6E2D8; border-radius: 8px; box-sizing: border-box; }
        .btn-info-update { background-color: #FF5A36; color: white; border: none; width: 100%; height: 45px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-info-withdraw { background-color: transparent; color: #8C8276; border: 1px solid #E6E2D8; width: 100%; height: 45px; border-radius: 8px; cursor: pointer; margin-top: 15px; }

        /* [대여 탭] */
        .rental-tabs { display: flex; gap: 8px; margin-bottom: 20px; padding: 0 24px; }
        .rental-tab { border: 1px solid #E6E2D8; background: #FFFFFF; color: #8C8276; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .rental-tab.active { background: #FF5A36; color: white; border-color: #FF5A36; }
    </style>
</head>
<body class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-logo">소소책방</div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-tab="view-home"><i class="fas fa-home"></i> 홈</a>
            <a href="#" class="nav-item" data-tab="view-rent-book"><i class="fas fa-book"></i> 도서 대여</a>
            <a href="#" class="nav-item" data-tab="view-my-rentals"><i class="fas fa-history"></i> 대여 정보 조회/반납</a>
            <a href="#" class="nav-item" data-tab="view-my-info"><i class="fas fa-user"></i> 내 정보</a>
        </nav>
    </aside>
    
    <main class="main-content">
        <header class="top-header">
            <h2 id="pageTitle">홈</h2>
            <div class="user-info">
                <span id="headerUserName">사용자</span>님 반갑습니다.
                <button id="btnLogout">
                    <span class="material-symbols-outlined">logout</span> 로그아웃
                </button>
            </div>
        </header>
        
        <div class="content-wrapper">
            <section id="view-home" class="view-section active">
                <div class="summary-grid">
                    <div class="card">
                        <div class="card-header"><h3>신간 도서</h3></div>
                        <div id="newBooksList" class="ranking-list"></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3>인기 대여 순위</h3></div>
                        <div id="popularBooksList" class="ranking-list"></div>
                    </div>
                </div>
            </section>

            <section id="view-rent-book" class="view-section">
                <div class="card">
                    <div class="card-header search-header">
                        <h3>전체 도서 목록</h3>
                        <div class="search-filter-container">
                            <input type="text" id="searchBookInput" placeholder="도서명 또는 저자 검색...">
                            <select id="filterCategory" class="filter-select"><option value="">전체 카테고리</option></select>
                            <select id="filterPublisher" class="filter-select"><option value="">전체 출판사</option></select>
                        </div>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>도서명</th><th>카테고리</th><th>저자</th><th>출판사</th><th style="width: 120px; text-align: center;">상태</th>
                            </tr>
                        </thead>
                        <tbody id="booksTableBody"></tbody>
                    </table>
                </div>
            </section>

            <section id="view-my-rentals" class="view-section">
                <div class="card">
                    <div class="card-header"><h3>내 대여 현황</h3></div>
                    <div class="rental-tabs">
                        <button id="btnCurrentRentals" class="rental-tab active">대출중</button>
                        <button id="btnRentalHistory" class="rental-tab">대출이력</button>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>도서명</th><th style="width: 150px;">대여일</th><th style="width: 150px;">반납예정일</th><th style="width: 100px; text-align: center;">관리</th>
                            </tr>
                        </thead>
                        <tbody id="myRentalsTableBody"></tbody>
                    </table>
                </div>
            </section>

            <section id="view-my-info" class="view-section">
                <div class="card" style="max-width: 450px; margin: 0 auto;">
                    <div class="card-header"><h3>내 정보 수정</h3></div>
                    <div style="padding: 25px;">
                        <form id="updateInfoForm">
                            <div class="form-group">
                                <label for="infoUserId">아이디</label>
                                <input type="text" id="infoUserId" readonly style="background-color: #F5F3EE;">
                            </div>
                            <div class="form-group">
                                <label for="infoName"><span class="material-symbols-outlined">person</span> 이름</label>
                                <input type="text" id="infoName" required>
                            </div>
                            <div class="form-group">
                                <label for="infoPassword">새 비밀번호</label>
                                <input type="password" id="infoPassword" placeholder="변경할 비밀번호 입력">
                            </div>
                            <button type="submit" class="btn-info-update">정보 수정</button>
                        </form>
                        <button id="btnWithdraw" class="btn-info-withdraw">회원 탈퇴하기</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
