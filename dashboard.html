<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문화의집 소소책방 도서 대여</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=book,logout,person" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* 프리텐다드 300 적용 */
        body { font-family: 'Pretendard', sans-serif !important; font-weight: 300 !important; background-color: #F5F3EE; margin: 0; display: flex; justify-content: center; }
        
        /* 1200px 고정 레이아웃 */
        .dashboard-container { width: 100%; max-width: 1200px; display: flex; min-height: 100vh; }
        
        /* 기존 스타일 유지 및 폰트 가중치 보정 */
        .sidebar { width: 240px; background-color: #2C2621; color: #FFFFFF; padding: 30px 20px; flex-shrink: 0; }
        .main-content { flex: 1; padding: 20px; }
        
        /* 로고 스타일 (크기 조정) */
        .material-symbols-outlined { font-size: 20px; vertical-align: middle; }
        .sidebar-logo { font-size: 22px; font-weight: 300; color: #FF5A36; margin-bottom: 40px; text-align: center; }
        
        /* 로그아웃 버튼 로고 정렬 */
        #btnLogout { display: inline-flex; align-items: center; gap: 6px; background-color: #8C8276; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 300; }
        
        /* 카드 및 기타 디자인은 기존 유지 */
        .card { background: #FFFFFF; border-radius: 16px; border: 1px solid #E6E2D8; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 20px rgba(44, 38, 33, 0.02); }
        .data-table th { font-weight: 400; }
        .nav-item { font-weight: 300; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-logo"><span class="material-symbols-outlined" style="font-size: 24px;">book</span> 소소책방</div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-tab="view-home"><i class="fas fa-home"></i> 홈</a>
                <a href="#" class="nav-item" data-tab="view-rent-book"><i class="fas fa-book"></i> 도서 대여</a>
                <a href="#" class="nav-item" data-tab="view-my-rentals"><i class="fas fa-history"></i> 대여 정보 조회</a>
                <a href="#" class="nav-item" data-tab="view-my-info">
                    <span class="material-symbols-outlined">person</span> 내 정보
                </a>
            </nav>
        </aside>
        
        <main class="main-content">
            <header class="top-header" style="display: flex; justify-content: space-between; align-items: center; padding: 20px 0;">
                <h2 id="pageTitle" style="font-weight: 300;">홈</h2>
                <div class="user-info">
                    <span id="headerUserName">사용자</span>님 반갑습니다.
                    <button id="btnLogout">
                        <span class="material-symbols-outlined">logout</span> 로그아웃
                    </button>
                </div>
            </header>
            
            <div class="content-wrapper">
                <section id="view-home" class="view-section active">
                    <div class="card"><h3>신간 도서</h3><div id="newBooksList"></div></div>
                </section>
                </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
