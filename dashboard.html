<!DOCTYPE html>
<html class="light" lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>문화의집 소소책방 - 대시보드</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <link as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#ffdad6",
                        "background": "#F5F3EE", 
                        "on-surface": "#2C2621", 
                        "secondary": "#FF5A36", 
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#E6E2D8",
                        "outline": "#8C8276",
                        "primary": "#2C2621", 
                        "surface-container": "#FAF9F6",
                        "surface-container-low": "#F5F3EE",
                        "on-surface-variant": "#8C8276"
                    },
                    "spacing": {
                        "container-max": "1200px",
                        "gutter": "24px"
                    }
                },
            },
        }
    </script>
    <style>
        body {
            background-color: #F5F3EE;
            font-family: 'Pretendard', sans-serif;
            font-weight: 300;
        }
        /* 구글 아이콘 기호 깨짐 방지 셋팅 */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .font-bold, .font-semibold, .font-medium { font-weight: 300 !important; }
    </style>
</head>
<body class="text-on-surface font-light">

    <header class="fixed top-0 right-0 w-full bg-surface-container-lowest z-50 h-16 flex items-center justify-center shadow-[0px_4px_20px_rgba(44,38,33,0.02)] px-gutter border-b border-outline-variant/60">
        <div class="w-full max-w-container-max flex justify-between items-center px-4">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-secondary text-2xl">book</span>
                <span class="text-lg text-primary font-light tracking-tight">소소책방 도서 대여 프로그램</span>
            </div>
            <div class="flex items-center gap-4">
                <button class="flex items-center gap-2 bg-surface-container-low py-1.5 px-4 rounded-full border border-outline-variant/80 hover:bg-secondary/10 hover:border-secondary/30 transition-colors cursor-pointer group">
                    <span class="material-symbols-outlined text-on-surface-variant group-hover:text-secondary text-[18px]">logout</span>
                    <span class="text-xs text-on-surface-variant group-hover:text-secondary">로그아웃</span>
                </button>
            </div>
        </div>
    </header>

    <aside class="w-[260px] h-screen fixed left-0 top-0 bg-[#2C2621] text-white py-8 px-6 hidden lg:flex flex-col z-40 pt-24">
        <div class="flex-1 space-y-1.5">
            <a class="flex items-center gap-3 py-3 px-4 rounded-lg bg-[#3D352E] text-white font-light" href="dashboard.html">
                <i class="fas fa-home text-[#FF5A36] w-5 text-center"></i>
                <span class="text-sm">홈 (대시보드)</span>
            </a>
            <a class="flex items-center gap-3 py-3 px-4 rounded-lg text-[#A69E96] hover:bg-[#3D352E] hover:text-white transition-all" href="rent-books.html">
                <i class="fas fa-book-open w-5 text-center"></i>
                <span class="text-sm">도서 대여</span>
            </a>
            <a class="flex items-center gap-3 py-3 px-4 rounded-lg text-[#A69E96] hover:bg-[#3D352E] hover:text-white transition-all" href="book-location.html">
                <i class="fas fa-map-marked-alt w-5 text-center"></i>
                <span class="text-sm">도서 위치</span>
            </a>
            <a class="flex items-center gap-3 py-3 px-4 rounded-lg text-[#A69E96] hover:bg-[#3D352E] hover:text-white transition-all" href="rent-status.html">
                <i class="fas fa-list-ul w-5 text-center"></i>
                <span class="text-sm">대여 현황</span>
            </a>
            <a class="flex items-center gap-3 py-3 px-4 rounded-lg text-[#A69E96] hover:bg-[#3D352E] hover:text-white transition-all" href="profile.html">
                <i class="fas fa-user-cog w-5 text-center"></i>
                <span class="text-sm">내 정보</span>
            </a>
        </div>
        <div class="pt-6 border-t border-outline-variant/10"></div>
    </aside>

    <main class="lg:ml-[260px] pt-24 pb-12 px-gutter flex justify-center">
        <div class="w-full max-w-container-max space-y-6 px-4">
            <header class="mb-2">
                <h1 class="text-2xl text-primary font-light mb-1">안녕하세요, <span id="userName" class="font-light">회원</span>님!</h1>
                <p class="text-sm text-on-surface-variant">소소책방 도서 대여 프로그램에 오신 것을 환영합니다.</p>
            </header>

            <section class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
                <div class="bg-white p-6 rounded-xl border border-outline-variant shadow-[0px_4px_15px_rgba(44,38,33,0.01)] flex items-center justify-between w-full">
                    <div>
                        <p class="text-xs text-on-surface-variant mb-1">대여 중인 도서</p>
                        <p class="text-2xl text-primary font-light" id="rentingCount">0권</p>
                    </div>
                    <div class="w-12 h-12 rounded-lg bg-[#FFF5F2] flex items-center justify-center text-[#FF5A36]">
                        <span class="material-symbols-outlined text-xl">menu_book</span>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl border border-outline-variant shadow-[0px_4px_15px_rgba(44,38,33,0.01)] flex items-center justify-between w-full">
                    <div>
                        <p class="text-xs text-on-surface-variant mb-1">이번 달 대여한 도서</p>
                        <p class="text-2xl text-primary font-light" id="monthCount">0권</p>
                    </div>
                    <div class="w-12 h-12 rounded-lg bg-[#FFF5F2] flex items-center justify-center text-[#FF5A36]">
                        <span class="material-symbols-outlined text-xl">calendar_today</span>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl border border-outline-variant shadow-[0px_4px_15px_rgba(44,38,33,0.01)] flex items-center justify-between w-full">
                    <div>
                        <p class="text-xs text-on-surface-variant mb-1">연체 중인 도서</p>
                        <p class="text-2xl text-[#FF5A36] font-light" id="overdueCount">0권</p>
                    </div>
                    <div class="w-12 h-12 rounded-lg bg-[#FFF0ED] flex items-center justify-center text-[#FF5A36]">
                        <span class="material-symbols-outlined text-xl">warning</span>
                    </div>
                </div>
            </section>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-start w-full">
                <div class="md:col-span-8">
                    <div class="bg-white rounded-xl p-8 shadow-[0px_4px_15px_rgba(44,38,33,0.01)] border border-outline-variant">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-lg text-primary flex items-center gap-2 font-light">
                                <span class="material-symbols-outlined text-secondary text-2xl">new_releases</span>
                                신간 도서
                            </h2>
                            <button class="text-secondary text-xs hover:underline font-light">전체 보기</button>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4" id="newBooksContainer">
                            </div>
                    </div>
                </div>

                <div class="md:col-span-4 w-full">
                    <div class="bg-white rounded-xl p-6 shadow-[0px_4px_15px_rgba(44,38,33,0.01)] border border-outline-variant h-full flex flex-col justify-between">
                        <div>
                            <h2 class="text-lg text-primary mb-5 flex items-center gap-2 font-light px-1">
                                <span class="material-symbols-outlined text-secondary text-2xl">trending_up</span>
                                인기 대여 순위
                            </h2>
                            <ol class="space-y-1" id="popularBooksContainer">
                                </ol>
                        </div>
                        <button class="w-full mt-5 py-2.5 border border-outline/70 text-on-surface-variant rounded-lg text-xs hover:bg-surface-container hover:text-primary transition-colors flex items-center justify-center gap-1 font-light">
                            전체 순위 보기
                            <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="toastContainer" class="fixed top-8 left-1/2 -translate-x-1/2 z-[9999]"></div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
    
    <script>
        // 클릭 애니메이션 인터랙션 효과 
        document.querySelectorAll('a, button, .cursor-pointer').forEach(el => {
            el.addEventListener('mousedown', () => el.classList.add('scale-[0.98]'));
            el.addEventListener('mouseup', () => el.classList.remove('scale-[0.98]'));
            el.addEventListener('mouseleave', () => el.classList.remove('scale-[0.98]'));
        });
    </script>
</body>
</html>
