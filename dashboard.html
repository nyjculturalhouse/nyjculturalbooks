<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서관리 시스템 - 대시보드</title>
    <link rel="stylesheet" href="style.css"> <!-- 이전에 작성한 CSS 파일 -->
</head>
<body>

    <div class="dashboard-layout">
        <!-- 1. 사이드바 -->
        <aside class="sidebar">
            <div class="sidebar-logo">LIBRARY</div>
            <nav>
                <a href="#" class="nav-item active" data-tab="view-home">
                    <span>🏠</span> 홈
                </a>
                <a href="#" class="nav-item" data-tab="view-rent-book">
                    <span>📚</span> 도서 대여
                </a>
                <a href="#" class="nav-item" data-tab="view-my-rentals">
                    <span>🕒</span> 대여/반납 조회
                </a>
                <a href="#" class="nav-item" data-tab="view-my-info">
                    <span>👤</span> 내 정보 수정
                </a>
            </nav>
        </aside>

        <!-- 2. 메인 콘텐츠 영역 -->
        <main class="main-content">
            <!-- 상단 헤더 -->
            <header class="header-container">
                <h2 id="pageTitle">홈</h2>
                <div class="user-status">
                    <span id="headerUserName">사용자</span>님 반갑습니다
                    <button id="btnLogout" class="btn-logout">로그아웃</button>
                </div>
            </header>

            <!-- 섹션 1: 홈 (대시보드 요약) -->
            <section id="view-home" class="view-section active">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                    <!-- 신간 도서 -->
                    <div class="card">
                        <h3>🆕 신간 도서</h3>
                        <div id="newBooksList" style="margin-top: 20px;">
                            <!-- JS: renderNewBooks() -->
                        </div>
                    </div>
                    <!-- 인기 도서 -->
                    <div class="card">
                        <h3>🔥 인기 대여 도서</h3>
                        <div id="popularBooksList" style="margin-top: 20px;">
                            <!-- JS: renderPopularBooks() -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- 섹션 2: 도서 대여 (목록 및 검색) -->
            <section id="view-rent-book" class="view-section">
                <div class="card">
                    <div class="search-filter-container">
                        <input type="text" id="searchBookInput" placeholder="도서명 또는 저자 검색">
                        <select id="filterCategory">
                            <option value="">전체 카테고리</option>
                        </select>
                        <select id="filterPublisher">
                            <option value="">전체 출판사</option>
                        </select>
                    </div>
                    <div style="margin-top: 24px; overflow-x: auto;">
                        <table class="book-table">
                            <thead>
                                <tr>
                                    <th style="width: 40%; text-align: left;">도서명</th>
                                    <th>카테고리</th>
                                    <th>저자</th>
                                    <th>출판사</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="booksTableBody">
                                <!-- JS: renderBooks() -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- 섹션 3: 대여 정보 조회/반납 -->
            <section id="view-my-rentals" class="view-section">
                <div class="card">
                    <table class="book-table">
                        <thead>
                            <tr>
                                <th style="width: 45%; text-align: left;">도서명</th>
                                <th>대여일</th>
                                <th>반납예정일</th>
                                <th>상태/반납</th>
                            </tr>
                        </thead>
                        <tbody id="myRentalsTableBody">
                            <!-- JS: loadMyRentals() -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- 섹션 4: 내 정보 수정 -->
            <section id="view-my-info" class="view-section">
                <div class="card" style="max-width: 500px;">
                    <form id="updateInfoForm">
                        <div class="form-group">
                            <label>아이디</label>
                            <input type="text" id="infoUserId" readonly style="background: #eee; cursor: not-allowed;">
                        </div>
                        <div class="form-group">
                            <label>이름</label>
                            <input type="text" id="infoName" required>
                        </div>
                        <div class="form-group">
                            <label>새 비밀번호</label>
                            <input type="password" id="infoPassword" placeholder="변경할 비밀번호 입력">
                        </div>
                        <div style="display: flex; gap: 12px; margin-top: 32px;">
                            <button type="submit" class="btn-primary">정보 수정 저장</button>
                            <button type="button" id="btnWithdraw" class="btn-link-danger">회원 탈퇴</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <!-- 토스트 알림 컨테이너 -->
    <div id="toastContainer"></div>

    <!-- 스크립트 로드 -->
    <script src="api.js"></script> <!-- API 공통 모듈 -->
    <script src="ui.js"></script>  <!-- UI/Toast 공통 모듈 -->
    <script src="script.js"></script> <!-- 제공해주신 JS 코드 -->
</body>
</html>
