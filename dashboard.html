<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문화의집 소소책방 - 대시보드</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=book" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <style>
        body, input, button, a {
            font-family: 'Pretendard', sans-serif !important;
            font-weight: 300;
        }
        .dashboard-container { display: flex; min-height: 100vh; background-color: #F5F3EE; }
        .sidebar { background-color: #2C2621; color: #FFFFFF; width: 260px; padding: 30px 20px; box-sizing: border-box; display: flex; flex-direction: column; }
        .sidebar .brand { display: flex; align-items: center; gap: 8px; color: #FF5A36; font-size: 20px; font-weight: 400; margin-bottom: 40px; padding-left: 10px; }
        .sidebar .brand .material-symbols-outlined { font-size: 28px; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu li { margin-bottom: 8px; }
        .sidebar-menu a { display: flex; align-items: center; gap: 12px; color: #A69E96; text-decoration: none; padding: 14px 16px; border-radius: 8px; font-size: 15px; transition: all 0.2s; }
        .sidebar-menu li.active a, .sidebar-menu a:hover { background-color: #3D352E; color: #FFFFFF; font-weight: 400; }
        .sidebar-menu li.active a i { color: #FF5A36; }
        .main-content { flex: 1; padding: 40px; box-sizing: border-box; }
        .welcome-header { margin-bottom: 35px; }
        .welcome-header h1 { font-size: 26px; color: #2C2621; margin: 0 0 8px 0; font-weight: 400; }
        .welcome-header p { color: #8C8276; margin: 0; font-size: 15px; }
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .summary-card { background: #FFFFFF; border: 1px solid #E6E2D8; border-radius: 12px; padding: 24px; box-shadow: 0 4px 15px rgba(44, 38, 33, 0.01); display: flex; align-items: center; justify-content: space-between; }
        .summary-info h3 { font-size: 14px; color: #8C8276; margin: 0 0 6px 0; font-weight: 400; }
        .summary-info .value { font-size: 24px; color: #2C2621; font-weight: 400; }
        .summary-icon { width: 48px; height: 48px; border-radius: 10px; background-color: #FFF5F2; color: #FF5A36; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        #toastContainer { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); z-index: 10000; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="brand">
                <span class="material-symbols-outlined">book</span>
                <span>소소책방</span>
            </div>
            <ul class="sidebar-menu">
                <li class="active"><a href="dashboard.html"><i class="fas fa-home"></i> 홈 (대시보드)</a></li>
                <li><a href="rent-books.html"><i class="fas fa-book-open"></i> 도서 대여</a></li>
                <li><a href="book-location.html"><i class="fas fa-map-marked-alt"></i> 도서 위치</a></li> <li><a href="rent-status.html"><i class="fas fa-list-ul"></i> 대여 현황</a></li>
                <li><a href="profile.html"><i class="fas fa-user-cog"></i> 내 정보</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="welcome-header">
                <h1>안녕하세요, <span id="userName">회원</span>님! 👋</h1>
                <p>소소책방 도서 대여 프로그램에 오신 것을 환영합니다.</p>
            </header>

            <section class="summary-grid">
                <div class="summary-card">
                    <div class="summary-info">
                        <h3>대여 중인 도서</h3>
                        <div class="value" id="rentingCount">0권</div>
                    </div>
                    <div class="summary-icon"><i class="fas fa-book"></i></div>
                </div>
                <div class="summary-card">
                    <div class="summary-info">
                        <h3>이번 달 대여한 도서</h3>
                        <div class="value" id="monthCount">0권</div>
                    </div>
                    <div class="summary-icon"><i class="fas fa-calendar-check"></i></div>
                </div>
                <div class="summary-card">
                    <div class="summary-info">
                        <h3>연체 중인 도서</h3>
                        <div class="value" style="color: #FF5A36;" id="overdueCount">0권</div>
                    </div>
                    <div class="summary-icon" style="background-color: #FFF0ED; color: #FF5A36;"><i class="fas fa-exclamation-triangle"></i></div>
                </div>
            </section>
        </main>
    </div>

    <div id="toastContainer"></div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
