<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문화의집 소소책방 도서 대여</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #FDFBF7; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        .active-nav { background-color: #FF5A36 !important; color: white !important; }
        .data-table th { padding: 12px; border-bottom: 2px solid #E6E2D8; color: #8C8276; }
        .data-table td { padding: 16px 12px; border-bottom: 1px solid #F0ECE2; }
    </style>
</head>
<body class="flex min-h-screen text-[#2C2621]">

    <aside class="w-64 bg-[#2C2621] text-white p-8 flex flex-col shrink-0">
        <div class="text-2xl font-bold text-[#FF5A36] mb-12 text-center tracking-tight">소소책방</div>
        <nav class="space-y-3">
            <a href="#" class="nav-item flex items-center gap-3 p-3 rounded-xl text-[#8C8276] hover:bg-white/5 hover:text-white transition active-nav" data-tab="view-home"><i class="fas fa-home"></i> 홈</a>
            <a href="#" class="nav-item flex items-center gap-3 p-3 rounded-xl text-[#8C8276] hover:bg-white/5 hover:text-white transition" data-tab="view-rent-book"><i class="fas fa-book"></i> 도서 대여</a>
            <a href="#" class="nav-item flex items-center gap-3 p-3 rounded-xl text-[#8C8276] hover:bg-white/5 hover:text-white transition" data-tab="view-my-rentals"><i class="fas fa-history"></i> 대여 현황</a>
            <a href="#" class="nav-item flex items-center gap-3 p-3 rounded-xl text-[#8C8276] hover:bg-white/5 hover:text-white transition" data-tab="view-my-info"><i class="fas fa-user"></i> 내 정보</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col">
        <header class="flex justify-between items-center py-6 px-10 bg-white border-b border-[#E6E2D8]">
            <h2 id="pageTitle" class="text-xl font-bold">홈</h2>
            <div class="flex items-center gap-4">
                <span class="text-sm"><span id="headerUserName" class="font-bold">사용자</span>님 반갑습니다.</span>
                <button id="btnLogout" class="bg-[#8C8276] text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 hover:bg-[#736a60] transition">
                    <i class="fas fa-sign-out-alt"></i> 로그아웃
                </button>
            </div>
        </header>

        <div class="p-10">
            <section id="view-home" class="view-section active grid grid-cols-2 gap-8">
                <div class="bg-white p-6 rounded-2xl border border-[#E6E2D8] shadow-sm"><h3 class="font-bold mb-4">신간 도서</h3><div id="newBooksList"></div></div>
                <div class="bg-white p-6 rounded-2xl border border-[#E6E2D8] shadow-sm"><h3 class="font-bold mb-4">인기 대여 순위</h3><div id="popularBooksList"></div></div>
            </section>

            <section id="view-rent-book" class="view-section bg-white p-8 rounded-2xl border border-[#E6E2D8] shadow-sm">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-lg">전체 도서 목록</h3>
                    <div class="flex items-center gap-4">
                        <label class="flex items-center gap-2 text-sm cursor-pointer">
                            <input type="checkbox" id="filterAvailableOnly" class="accent-[#FF5A36]"> 대여 가능 도서만 보기
                        </label>
                        <input type="text" id="searchBookInput" placeholder="검색..." class="border p-2 rounded-lg text-sm w-48">
                    </div>
                </div>
                <table class="data-table w-full text-left">
                    <thead><tr><th>도서명</th><th>카테고리</th><th>저자</th><th>출판사</th><th class="text-center">상태</th></tr></thead>
                    <tbody id="booksTableBody"></tbody>
                </table>
            </section>

            <section id="view-my-rentals" class="view-section bg-white p-8 rounded-2xl border border-[#E6E2D8] shadow-sm">
                <div class="flex gap-2 mb-6">
                    <button id="btnCurrentRentals" class="px-4 py-2 bg-[#FF5A36] text-white rounded-lg font-bold">대출중</button>
                    <button id="btnRentalHistory" class="px-4 py-2 border rounded-lg">대출이력</button>
                </div>
                <table class="data-table w-full">
                    <tbody id="myRentalsTableBody"></tbody>
                </table>
            </section>

            <section id="view-my-info" class="view-section">
                <div class="max-w-md mx-auto bg-white p-8 rounded-2xl border border-[#E6E2D8] shadow-sm">
                    <form id="updateInfoForm" class="space-y-4">
                        <div><label class="block text-sm font-bold mb-1">아이디</label><input type="text" id="infoUserId" readonly class="w-full p-3 bg-[#F5F3EE] rounded-lg"></div>
                        <div><label class="block text-sm font-bold mb-1">이름</label><input type="text" id="infoName" class="w-full p-3 border rounded-lg"></div>
                        <button type="submit" class="w-full bg-[#FF5A36] text-white py-3 rounded-lg font-bold">정보 수정</button>
                    </form>
                    <button id="btnWithdraw" class="w-full mt-4 text-[#8C8276] border py-3 rounded-lg">회원 탈퇴</button>
                </div>
            </section>
        </div>
    </main>

    <div id="overdueModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-96 text-center">
            <div class="text-[#FF5A36] text-4xl mb-4"><i class="fas fa-exclamation-triangle"></i></div>
            <h3 class="text-lg font-bold mb-2">연체 도서 확인</h3>
            <p class="text-gray-600 mb-6 text-sm">반납 예정일이 지난 도서가 있습니다.<br>도서관 이용에 제한이 있을 수 있으니 확인 바랍니다.</p>
            <button onclick="document.getElementById('overdueModal').classList.add('hidden')" 
                    class="w-full bg-[#2C2621] text-white py-3 rounded-lg font-bold">확인</button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
