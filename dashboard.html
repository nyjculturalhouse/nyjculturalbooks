<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문화의집 소소책방 도서 대여</title>
    <!-- CSS 경로 확인: css 폴더 안에 style.css가 있어야 함 -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-layout">
    <!-- 사이드바 -->
    <aside class="sidebar">
        <div class="sidebar-logo">소소책방</div>
        <nav class="sidebar-nav">
            <!-- JS의 setupTabs 함수가 data-tab 속성을 사용하여 제어함 -->
            <a href="#" class="nav-item active" data-tab="view-home">
                <i class="fas fa-home"></i> 홈
            </a>
            <a href="#" class="nav-item" data-tab="view-rent-book">
                <i class="fas fa-book"></i> 도서 대여
            </a>
            <a href="#" class="nav-item" data-tab="view-my-rentals">
                <i class="fas fa-history"></i> 대여 정보 조회/반납
            </a>
            <a href="#" class="nav-item" data-tab="view-my-info">
                <i class="fas fa-user"></i> 내 정보
            </a>
        </nav>
    </aside>
    
    <main class="main-content">
        <!-- 상단 헤더 -->
        <header class="top-header">
            <h2 id="pageTitle">홈</h2>
            <div class="user-info">
                <span id="headerUserName">사용자</span>님 반갑습니다.
                <button id="btnLogout" class="btn-outline">로그아웃</button>
            </div>
        </header>
        
        <div class="content-wrapper">
            <!-- 1. 홈 섹션 -->
            <section id="view-home" class="view-section active">
                <div class="summary-grid">
                    <div class="card">
                        <div class="card-header"><h3>신간 도서</h3></div>
                        <div id="newBooksList" class="ranking-list">
                            <p class="loading-text">불러오는 중...</p>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3>인기 대여 순위</h3></div>
                        <div id="popularBooksList" class="ranking-list">
                            <p class="loading-text">불러오는 중...</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 2. 도서 대여 섹션 -->
            <section id="view-rent-book" class="view-section">
                <div class="card">
                    <div class="card-header search-header">
                        <h3>전체 도서 목록</h3>
                        <div class="search-filter-container">
                            <input type="text" id="searchBookInput" placeholder="도서명 또는 저자 검색...">
                            <select id="filterCategory" class="filter-select">
                                <option value="">전체 카테고리</option>
                            </select>
                            <select id="filterPublisher" class="filter-select">
                                <option value="">전체 출판사</option>
                            </select>
                        </div>
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>도서명</th>
                                    <th>카테고리</th>
                                    <th>저자</th>
                                    <th>출판사</th>
                                    <th style="width: 100px; text-align: center;">상태</th>
                                </tr>
                            </thead>
                            <tbody id="booksTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- 3. 내 대여 목록 섹션 -->
            <section id="view-my-rentals" class="view-section">
                <div class="card">
                    <div class="card-header"><h3>내 대여 현황</h3></div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>도서명</th>
                                    <th>대여일</th>
                                    <th>반납예정일</th>
                                    <th style="width: 100px; text-align: center;">관리</th>
                                </tr>
                            </thead>
                            <tbody id="myRentalsTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- 4. 내 정보 섹션 -->
            <section id="view-my-info" class="view-section">
                <div class="card narrow-card">
                    <div class="card-header"><h3>내 정보 수정</h3></div>
                    <form id="updateInfoForm">
                        <div class="form-group">
                            <label>아이디</label>
                            <input type="text" id="infoUserId" readonly class="readonly-input">
                        </div>
                        <div class="form-group">
                            <label>이름</label>
                            <input type="text" id="infoName" required>
                        </div>
                        <div class="form-group">
                            <label>새 비밀번호 (변경 시에만 입력)</label>
                            <input type="password" id="infoPassword">
                        </div>
                        <button type="submit" class="btn-primary">정보 수정 저장</button>
                    </form>
                    <div class="danger-zone">
                        <p>더 이상 서비스를 이용하지 않으시나요?</p>
                        <button id="btnWithdraw" class="btn-link-danger">회원 탈퇴</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- 알림 메시지용 토스트 (UI.js 연동) -->
    <div id="toastContainer"></div>

    <!-- 스크립트 로드 -->
    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
