<!DOCTYPE html>
<html class="light" lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>문화의집 소소책방 - 대시보드</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #F5F3EE; font-family: 'Pretendard', sans-serif; font-weight: 300; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300; }
    </style>
</head>
<body class="text-[#2C2621] font-light">

    <header class="fixed top-0 right-0 w-full bg-white z-50 h-16 flex items-center justify-center shadow-[0px_4px_20px_rgba(44,38,33,0.02)] border-b border-[#E6E2D8]/60 px-6">
        <div class="w-full max-w-[1200px] flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-[#FF5A36] text-2xl">book</span>
                <span class="text-lg font-light tracking-tight">소소책방 도서 대여 프로그램</span>
            </div>
            <button class="flex items-center gap-2 bg-[#F5F3EE] py-1.5 px-4 rounded-full border border-[#E6E2D8] hover:border-[#FF5A36]/30 transition-colors">
                <span class="material-symbols-outlined text-sm">logout</span>
                <span class="text-xs">로그아웃</span>
            </button>
        </div>
    </header>

    <aside class="w-[260px] h-screen fixed left-0 top-0 bg-[#2C2621] text-white py-8 px-6 hidden lg:flex flex-col z-40 pt-24">
        <div class="flex-1 space-y-1.5">
            <a class="flex items-center gap-3 py-3 px-4 rounded-lg bg-[#3D352E]" href="dashboard.html">
                <i class="fas fa-home text-[#FF5A36] w-5 text-center"></i>
                <span class="text-sm">홈 (대시보드)</span>
            </a>
            <a class="flex items-center gap-3 py-3 px-4 rounded-lg text-[#A69E96] hover:bg-[#3D352E]" href="rent-books.html">
                <i class="fas fa-book-open w-5 text-center"></i>
                <span class="text-sm">도서 대여</span>
            </a>
            </div>
    </aside>

    <main class="lg:ml-[260px] pt-24 pb-12 px-6 flex justify-center">
        <div class="w-full max-w-[1200px] space-y-6">
            <header class="mb-2">
                <h1 class="text-2xl mb-1">안녕하세요, <span id="userName" class="font-light">회원</span>님!</h1>
                <p class="text-sm text-[#8C8276]">소소책방 도서 대여 프로그램에 오신 것을 환영합니다.</p>
            </header>

            <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl border border-[#E6E2D8] flex items-center justify-between">
                    <div><p class="text-xs text-[#8C8276] mb-1">대여 중인 도서</p><p class="text-2xl" id="rentingCount">0권</p></div>
                    <span class="material-symbols-outlined text-[#FF5A36]">menu_book</span>
                </div>
            </section>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                <div class="md:col-span-8">
                    <div class="bg-white rounded-xl p-8 border border-[#E6E2D8]">
                        <h2 class="text-lg mb-6 flex items-center gap-2"><span class="material-symbols-outlined text-[#FF5A36]">new_releases</span> 신간 도서</h2>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4" id="newBooksContainer"></div>
                    </div>
                </div>
                <div class="md:col-span-4">
                    <div class="bg-white rounded-xl p-6 border border-[#E6E2D8] h-full">
                        <h2 class="text-lg mb-5 flex items-center gap-2"><span class="material-symbols-outlined text-[#FF5A36]">trending_up</span> 인기 대여 순위</h2>
                        <ol class="space-y-1" id="popularBooksContainer"></ol>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
