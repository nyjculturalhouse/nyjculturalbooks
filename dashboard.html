<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문화의집 소소책방 도서 대여</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=logout,person,home,book,history,manage_accounts" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <style>
        body { font-family: 'Pretendard', sans-serif !important; background-color: #F5F3EE; color: #2C2621; }
        .dashboard-layout { display: flex; min-height: 100vh; }
        
        /* 사이드바 */
        .sidebar { width: 260px; background-color: #FFFFFF; border-right: 1px solid #E6E2D8; padding: 30px 20px; }
        .sidebar-logo { font-size: 22px; font-weight: 700; color: #FF5A36; margin-bottom: 40px; text-align: center; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 14px 18px; color: #8C8276; text-decoration: none; border-radius: 8px; margin-bottom: 8px; transition: 0.2s; }
        .nav-item:hover { background-color: #FFF5F2; color: #FF5A36; }
        .nav-item.active { background-color: #FF5A36; color: #FFFFFF; }

        /* 메인 컨텐츠 */
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .top-header { display: flex; justify-content: space-between; align-items: center; padding: 25px 40px; }
        .content-wrapper { padding: 0 40px; }
        
        /* 카드 및 테이블 스타일 */
        .card { background: #FFFFFF; border-radius: 16px; border: 1px solid #E6E2D8; box-shadow: 0 4px 20px rgba(44, 38, 33, 0.02); margin-bottom: 24px; overflow: hidden; }
        .card-header { padding: 20px 24px; border-bottom: 1px solid #E6E2D8; display: flex; justify-content: space-between; align-items: center; }
        
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th { background-color: #F9F8F6; padding: 16px; text-align: left; font-size: 14px; border-bottom: 1px solid #E6E2D8; }
        .data-table td { padding: 16px; border-bottom: 1px solid #E6E2D8; font-size: 14px; }

        /* 사용자 정보 및 버튼 */
        #btnLogout { background-color: #F5F3EE; color: #8C8276; border: 1px solid #E6E2D8; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .btn-info-update { background-color: #FF5A36; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-info-withdraw { background-color: transparent; color: #8C8276; border: 1px solid #E6E2D8; width: 100%; padding: 12px; border-radius: 8px; margin-top: 10px; cursor: pointer; }
        
        /* 탭 스타일 */
        .rental-tabs { display: flex; gap: 8px; padding: 20px; }
        .rental-tab { padding: 8px 16px; border: 1px solid #E6E2D8; border-radius: 8px; cursor: pointer; background: #FFF; }
        .rental-tab.active { background: #FF5A36; color: #FFF; border-color: #FF5A36; }
        
        .view-section { display: none; }
        .view-section.active { display: block; }
    </style>
</head>
<body class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-logo">소소책방</div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-tab="view-home"><i class="fas fa-home"></i> 홈</a>
            <a href="#" class="nav-item" data-tab="view-rent-book"><i class="fas fa-book"></i> 도서 대여</a>
            <a href="#" class="nav-item" data-tab="view-my-rentals"><i class="fas fa-history"></i> 대여 정보 조회/반납</a>
            <a href="#" class="nav-item" data-tab="view-my-info"><i class="fas fa-user"></i> 내 정보</a>
        </nav>
    </aside>
    
    <main class="main-content">
        <header class="top-header">
            <h2 id="pageTitle" style="font-size: 24px;">홈</h2>
            <div class="user-info">
                <span id="headerUserName">사용자</span>님 반갑습니다.
                <button id="btnLogout">
                    <span class="material-symbols-outlined" style="font-size:18px;">logout</span> 로그아웃
                </button>
            </div>
        </header>
        
        <div class="content-wrapper">
            <section id="view-home" class="view-section active">
                <div class="summary-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                    <div class="card">
                        <div class="card-header"><h3>신간 도서</h3></div>
                        <div id="newBooksList" style="padding: 20px;"></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3>인기 대여 순위</h3></div>
                        <div id="popularBooksList" style="padding: 20px;"></div>
                    </div>
                </div>
            </section>
            
            <section id="view-rent-book" class="view-section">
                <div class="card">
                    <div class="card-header"><h3>전체 도서 목록</h3></div>
                    <table class="data-table">
                        <thead><tr><th>도서명</th><th>카테고리</th><th>저자</th><th>출판사</th><th>상태</th></tr></thead>
                        <tbody id="booksTableBody"></tbody>
                    </table>
                </div>
            </section>

            <section id="view-my-info" class="view-section">
                <div class="card" style="max-width: 450px; margin: 0 auto;">
                    <div class="card-header"><h3>내 정보 수정</h3></div>
                    <div style="padding: 25px;">
                        <form id="updateInfoForm">
                            <div class="form-group"><label>아이디</label><input type="text" id="infoUserId" readonly style="padding:12px; width:100%; border:1px solid #E6E2D8; border-radius:8px;"></div>
                            <div class="form-group"><label>이름</label><input type="text" id="infoName" required style="padding:12px; width:100%; border:1px solid #E6E2D8; border-radius:8px;"></div>
                            <button type="submit" class="btn-info-update">정보 수정</button>
                        </form>
                        <button id="btnWithdraw" class="btn-info-withdraw">회원 탈퇴하기</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
