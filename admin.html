<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 대시보드</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-layout">
    <aside class="sidebar admin-sidebar">
        <div class="sidebar-logo">Admin Panel</div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-target="admin-users">전체 회원 조회</a>
            <a href="#" class="nav-item" data-target="admin-books">도서 관리 (등록/수정/삭제)</a>
            <a href="#" class="nav-item" data-target="admin-history">전체 대여 기록</a>
            <a href="#" class="nav-item" data-target="admin-current-rentals">현재 대여중 도서</a>
        </nav>
    </aside>
    
    <main class="main-content">
        <header class="top-header">
            <h2 id="pageTitle">전체 회원 조회</h2>
            <div class="user-info">
                <span id="headerUserName">관리자</span>님
                <button id="btnLogout" class="btn-outline">로그아웃</button>
            </div>
        </header>
        
        <div class="content-wrapper">
            <!-- 회원 조회 -->
            <section id="admin-users" class="view-section active">
                <div class="card">
                    <h3>회원 목록</h3>
                    <div class="table-container">
                        <table class="data-table">
                            <thead><tr><th>ID</th><th>이름</th><th>권한</th><th>가입일</th></tr></thead>
                            <tbody id="usersTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- 도서 관리 -->
            <section id="admin-books" class="view-section">
                <div class="card mb-4">
                    <h3>신규 도서 등록</h3>
                    <form id="addBookForm" class="grid-form">
                        <input type="text" id="addIsbn" placeholder="ISBN" required>
                        <input type="text" id="addTitle" placeholder="도서명" required>
                        <input type="number" id="addPages" placeholder="페이지수" required>
                        <input type="text" id="addAuthor" placeholder="저자" required>
                        <input type="text" id="addPublisher" placeholder="출판사" required>
                        <button type="submit" class="btn-primary">등록</button>
                    </form>
                </div>
                <div class="card">
                    <h3>도서 목록 (수정/삭제)</h3>
                    <div class="table-container">
                        <table class="data-table">
                            <thead><tr><th>ISBN</th><th>도서명</th><th>저자</th><th>상태</th><th>관리</th></tr></thead>
                            <tbody id="adminBooksTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- 대여 기록 -->
            <section id="admin-history" class="view-section">
                <div class="card">
                    <h3>전체 대여 기록</h3>
                    <div class="table-container">
                        <table class="data-table">
                            <thead><tr><th>대여 ID</th><th>회원 ID</th><th>ISBN</th><th>도서명</th><th>대출일</th><th>반납예정일</th><th>상태</th></tr></thead>
                            <tbody id="historyTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- 현재 대여중 -->
            <section id="admin-current-rentals" class="view-section">
                <div class="card">
                    <h3>현재 대여중 도서</h3>
                    <div class="table-container">
                        <table class="data-table">
                            <thead><tr><th>대여 ID</th><th>회원 ID</th><th>도서명</th><th>대출일</th><th>반납예정일</th></tr></thead>
                            <tbody id="currentRentalsTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- 도서 수정 모달 -->
    <div id="editBookModal" class="modal hidden">
        <div class="modal-content">
            <h3>도서 수정</h3>
            <form id="editBookForm">
                <div class="form-group"><label>ISBN (수정불가)</label><input type="text" id="editIsbn" readonly disabled></div>
                <div class="form-group"><label>도서명</label><input type="text" id="editTitle" required></div>
                <div class="form-group"><label>페이지수</label><input type="number" id="editPages" required></div>
                <div class="form-group"><label>저자</label><input type="text" id="editAuthor" required></div>
                <div class="form-group"><label>출판사</label><input type="text" id="editPublisher" required></div>
                <div class="modal-actions">
                    <button type="button" class="btn-outline" id="btnCancelEdit">취소</button>
                    <button type="submit" class="btn-primary">수정 완료</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
