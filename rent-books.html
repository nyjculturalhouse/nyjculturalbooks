<!DOCTYPE html>
<html class="light" lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>문화의집 소소책방 - 도서 대여</title>
    
    <!-- Tailwind CSS 및 플러그인 -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Pretendard 글꼴 및 구글 머티리얼 아이콘 최신형식 로드 -->
    <link as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Tailwind 테마 컬러 정의 -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#ffdad6",
                        "background": "#F5F3EE", 
                        "on-surface": "#2C2621", 
                        "secondary": "#FF5A36", 
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#E6E2D8",
                        "outline": "#8C8276",
                        "primary": "#2C2621", 
                        "surface-container": "#FAF9F6",
                        "surface-container-low": "#F5F3EE",
                        "on-surface-variant": "#8C8276"
                    },
                    "spacing": {
                        "container-max": "1200px",
                        "gutter": "24px"
                    }
                },
            },
        }
    </script>
    <style>
        body {
            background-color: #F5F3EE;
            font-family: 'Pretendard', sans-serif;
            font-weight: 300;
        }
        /* 구글 아이콘 기호 깨짐 방지 셋팅 */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .font-bold, .font-semibold, .font-medium { font-weight: 300 !important; }
    </style>
</head>
<body class="text-on-surface font-light">

    <!-- 상단 네비게이션 헤더 -->
    <header class="fixed top-0 right-0 w-full bg-surface-container-lowest z-50 h-16 flex items-center justify-center shadow-[0px_4px_20px_rgba(44,38,33,0.02)] px-gutter border-b border-outline-variant/60">
        <div class="w-full max-w-container-max flex justify-between items-center px-4">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-secondary text-2xl">book</span>
                <span class="text-lg text-primary font-light tracking-tight">소소책방 도서 대여 프로그램</span>
            </div>
            <div class="flex items-center gap-4">
                <button class="flex items-center gap-2 bg-surface-container-low py-1.5 px-4 rounded-full border border-outline-variant/80 hover:bg-secondary/10 hover:border-secondary/30 transition-colors cursor-pointer group">
                    <span class="material-symbols-outlined text-on-surface-variant group-hover:text-secondary text-[18px]">logout</span>
                    <span class="text-xs text-on-surface-variant group-hover:text-secondary">로그아웃</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 좌측 사이드바 네비게이션 -->
    <aside class="w-[260px] h-screen fixed left-0 top-0 bg-[#2C2621] text-white py-8 px-6 hidden lg:flex flex-col z-40 pt-24">
        <div class="flex-1 space-y-1.5">
            <a class="flex items-center gap-3 py-3 px-4 rounded-lg text-[#A69E96] hover:bg-[#3D352E] hover:text-white transition-all" href="dashboard.html">
                <i class="fas fa-home w-5 text-center"></i>
                <span class="text-sm">홈 (대시보드)</span>
            </a>
            <a class="flex items-center gap-3 py-3 px-4 rounded-lg bg-[#3D352E] text-white font-light" href="rent-books.html">
                <i class="fas fa-book-open text-[#FF5A36] w-5 text-center"></i>
                <span class="text-sm">도서 대여</span>
            </a>
            <a class="flex items-center gap-3 py-3 px-4 rounded-lg text-[#A69E96] hover:bg-[#3D352E] hover:text-white transition-all" href="book-location.html">
                <i class="fas fa-map-marked-alt w-5 text-center"></i>
                <span class="text-sm">도서 위치</span>
            </a>
            <a class="flex items-center gap-3 py-3 px-4 rounded-lg text-[#A69E96] hover:bg-[#3D352E] hover:text-white transition-all" href="rent-status.html">
                <i class="fas fa-list-ul w-5 text-center"></i>
                <span class="text-sm">대여 현황</span>
            </a>
            <a class="flex items-center gap-3 py-3 px-4 rounded-lg text-[#A69E96] hover:bg-[#3D352E] hover:text-white transition-all" href="profile.html">
                <i class="fas fa-user-cog w-5 text-center"></i>
                <span class="text-sm">내 정보</span>
            </a>
        </div>
        <div class="pt-6 border-t border-outline-variant/10"></div>
    </aside>

    <!-- 메인 본문 콘텐츠 영역 -->
    <main class="lg:ml-[260px] pt-24 pb-12 px-gutter flex justify-center">
        <div class="w-full max-w-container-max space-y-6 px-4">
            
            <!-- 페이지 헤더 -->
            <header class="mb-2">
                <h1 class="text-2xl text-primary font-light mb-1">도서 검색 및 대여</h1>
                <p class="text-sm text-on-surface-variant">소소책방이 보유한 도서를 검색하고 간편하게 대여해 보세요.</p>
            </header>

            <!-- 검색 및 필터 바 -->
            <section class="bg-white border border-outline-variant rounded-xl p-5 shadow-[0px_4px_15px_rgba(44,38,33,0.01)] flex flex-col sm:flex-row gap-3 items-center w-full">
                <select id="searchCategory" class="w-full sm:w-32 py-2.5 px-3 border border-outline-variant rounded-lg bg-white text-sm text-primary focus:border-secondary focus:ring-0 outline-none transition-colors">
                    <option value="all">전체 도서</option>
                    <option value="title">도서명</option>
                    <option value="author">저자</option>
                </select>
                <div class="w-full flex-1 relative flex items-center">
                    <i class="fas fa-search absolute left-4 text-on-surface-variant/70"></i>
                    <input type="text" id="searchKeyword" placeholder="검색어를 입력해 주세요..." class="w-full py-2.5 pl-11 pr-4 border border-outline-variant rounded-lg text-sm text-primary placeholder-on-surface-variant/50 focus:border-secondary focus:ring-0 outline-none transition-colors">
                </div>
                <button class="w-full sm:w-auto bg-secondary text-white py-2.5 px-6 rounded-lg text-sm hover:bg-secondary/90 transition-colors cursor-pointer whitespace-nowrap" id="btnSearch">검색</button>
            </section>

            <!-- 도서 그리드 리스트 컨테이너 -->
            <section class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 w-full" id="bookListContainer">
                <!-- 로딩 바 (JS 연동 전 초기 상태) -->
                <div class="col-span-full text-center text-on-surface-variant py-12">
                    <i class="fas fa-spinner fa-spin text-2xl text-secondary mb-3"></i>
                    <p class="text-sm">도서 데이터를 불러오는 중입니다...</p>
                </div>
            </section>
        </div>
    </main>

    <!-- 토스트 알림창 홀더 -->
    <div id="toastContainer" class="fixed top-8 left-1/2 -translate-x-1/2 z-[9999]"></div>

    <!-- 스크립트 파일 연결 구조 -->
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard-books.js"></script>
<script>
    // 클릭 피드백 상호작용
    document.querySelectorAll('a, button, .cursor-pointer').forEach(el => {
        el.addEventListener('mousedown', () => el.classList.add('scale-[0.98]'));
        el.addEventListener('mouseup', () => el.classList.remove('scale-[0.98]'));
        el.addEventListener('mouseleave', () => el.classList.remove('scale-[0.98]'));
    });
</script>
</body>
</html>
