<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문화의집 소소책방 - 도서 대여</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=book" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <style>
        body, input, button, a, select {
            font-family: 'Pretendard', sans-serif !important;
            font-weight: 300;
        }
        
        .dashboard-container {
            display: flex;
            min-height: 100vh;
            background-color: #F5F3EE;
        }

        /* 공통 사이드바 (디자인 싱크 유지) */
        .sidebar {
            background-color: #2C2621;
            color: #FFFFFF;
            width: 260px;
            padding: 30px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #FF5A36;
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 40px;
            padding-left: 10px;
        }

        .sidebar .brand .material-symbols-outlined { font-size: 28px; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu li { margin-bottom: 8px; }
        
        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #A69E96;
            text-decoration: none;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
        }

        .sidebar-menu li.active a,
        .sidebar-menu a:hover {
            background-color: #3D352E;
            color: #FFFFFF;
            font-weight: 400;
        }

        .sidebar-menu li.active a i { color: #FF5A36; }

        /* 메인 콘텐츠 영역 */
        .main-content {
            flex: 1;
            padding: 40px;
            box-sizing: border-box;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 24px;
            color: #2C2621;
            margin: 0 0 6px 0;
            font-weight: 400;
        }

        .page-header p {
            color: #8C8276;
            margin: 0;
            font-size: 14px;
        }

        /* 검색 및 필터 바 */
        .search-section {
            background: #FFFFFF;
            border: 1px solid #E6E2D8;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: 0 4px 15px rgba(44, 38, 33, 0.01);
        }

        .search-section select {
            padding: 12px;
            border: 1px solid #E6E2D8;
            border-radius: 8px;
            outline: none;
            color: #2C2621;
            background-color: #FFFFFF;
            font-size: 14px;
            min-width: 120px;
        }

        .search-input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input-wrapper i {
            position: absolute;
            left: 16px;
            color: #8C8276;
        }

        .search-input-wrapper input {
            width: 100%;
            padding: 12px 12px 12px 45px;
            border: 1px solid #E6E2D8;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .search-input-wrapper input:focus {
            border-color: #FF5A36;
        }

        .btn-search {
            background-color: #FF5A36;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 400;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        /* 도서 그리드 리스트 */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .book-card {
            background: #FFFFFF;
            border: 1px solid #E6E2D8;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(44, 38, 33, 0.01);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .book-info h3 {
            font-size: 16px;
            color: #2C2621;
            margin: 0 0 8px 0;
            font-weight: 400;
            line-height: 1.4;
        }

        .book-author {
            font-size: 13px;
            color: #8C8276;
            margin-bottom: 12px;
        }

        /* 대여 버튼 및 상태 */
        .book-action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            border-top: 1px solid #F5F3EE;
            padding-top: 16px;
        }

        .book-status {
            font-size: 13px;
            font-weight: 400;
        }

        .status-available { color: #00B894; }
        .status-rented { color: #8C8276; }

        .btn-rent {
            background-color: #2C2621;
            color: #FFFFFF;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-rent:hover {
            background-color: #FF5A36;
        }

        .btn-rent:disabled {
            background-color: #E6E2D8;
            color: #A69E96;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="brand">
                <span class="material-symbols-outlined">book</span>
                <span>소소책방</span>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-home"></i> 홈 (대시보드)</a></li>
                <li class="active"><a href="rent-books.html"><i class="fas fa-book-open"></i> 도서 대여</a></li>
                <li><a href="book-location.html"><i class="fas fa-map-marked-alt"></i> 도서 위치</a></li>
                <li><a href="rent-status.html"><i class="fas fa-list-ul"></i> 대여 현황</a></li>
                <li><a href="profile.html"><i class="fas fa-user-cog"></i> 내 정보</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <h1>도서 검색 및 대여</h1>
                <p>소소책방이 보유한 도서를 검색하고 간편하게 대여해 보세요.</p>
            </header>

            <section class="search-section">
                <select id="searchCategory">
                    <option value="all">전체 도서</option>
                    <option value="title">도서명</option>
                    <option value="author">저자</option>
                </select>
                <div class="search-input-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchKeyword" placeholder="검색어를 입력해 주세요...">
                </div>
                <button class="btn-search" id="btnSearch">검색</button>
            </section>

            <section class="book-grid" id="bookListContainer">
                <div style="grid-column: 1/-1; text-align: center; color: #8C8276; padding: 50px 0;">
                    <i class="fas fa-spinner fa-spin" style="font-size: 24px; color: #FF5A36; margin-bottom: 10px;"></i>
                    <p style="margin: 0;">도서 데이터를 불러오는 중입니다...</p>
                </div>
            </section>
        </main>
    </div>

    <div id="toastContainer"></div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard-books.js"></script> </body>
</html>
