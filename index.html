<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>도서 대출 시스템</title>

<style>
* { box-sizing: border-box; }

body {
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: #f4f7fb;
}

/* 상단 */
.header {
  background: #658dc6;
  color: white;
  padding: 20px 40px;
  font-size: 22px;
  font-weight: bold;
}

/* 전체 */
.container {
  max-width: 1200px;
  margin: 30px auto;
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 20px;
}

/* 카드 */
.card {
  background: white;
  border-radius: 16px;
  padding: 25px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.05);
}

/* 입력 */
.input-group {
  display: flex;
  gap: 10px;
}

.input-group input {
  flex: 1;
  padding: 16px;
  font-size: 16px;
  border: 1px solid #ddd;
  border-radius: 10px;
}

/* 버튼 */
button {
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
  padding:14px;
}

.btn-primary { background: #658dc6; color: white; }
.btn-green { background: #4caf50; color: white; }
.btn-red { background: #e53935; color: white; }

/* 책 카드 */
.book-card {
  display: flex;
  gap: 20px;
  margin-top: 20px;
}

.book-img {
  width: 180px;
  border-radius: 10px;
}

.book-title {
  font-size: 20px;
  font-weight: bold;
}

/* 상태 */
.status {
  margin-top: 10px;
  padding: 6px 12px;
  border-radius: 20px;
  display:inline-block;
}

.available { background:#e3efff; color:#2c5aa0; }
.borrowed { background:#ffe5e5; color:#c62828; }

/* 오른쪽 */
.side-card input, select {
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ddd;
}

.action-btns {
  display:flex;
  gap:10px;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="header">📚 도서관 대출 시스템</div>

<div class="container">

  <!-- 왼쪽 -->
  <div class="card">
    <div class="input-group">
      <input id="isbn" placeholder="ISBN 또는 바코드 스캔">
      <button class="btn-primary" onclick="getBook()">조회</button>
    </div>

    <div id="bookArea"></div>
  </div>

  <!-- 오른쪽 -->
  <div class="card side-card">

    <h3>회원 관리</h3>

    <input id="userName" placeholder="이름">
    <input id="userPhone" placeholder="전화번호">

    <button class="btn-primary" onclick="register()">회원가입</button>

    <select id="userSelect"></select>

    <div class="action-btns">
      <button class="btn-green" onclick="borrow()">대출</button>
      <button class="btn-red" onclick="returnBook()">반납</button>
    </div>

  </div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzKZsphyic_EsPpABC1VaBhEmVppWeIuCIRatHIDeaYb4P8zG_q9MngtyTGIXkRm8IP/exec";

let currentBook = null;
let currentStatus = "가능";

// 엔터 조회
document.getElementById("isbn").addEventListener("keypress", e => {
  if(e.key==="Enter") getBook();
});

// 📚 조회 (책 + 상태 같이)
function getBook() {
  const isbn = document.getElementById("isbn").value;

  // 책 정보
  const s1 = document.createElement("script");
  s1.src = API_URL + "?action=getBook&isbn="+isbn+"&callback=handleBook";
  document.body.appendChild(s1);

  // 상태
  const s2 = document.createElement("script");
  s2.src = API_URL + "?action=checkStatus&isbn="+isbn+"&callback=handleStatus";
  document.body.appendChild(s2);
}

// 상태
function handleStatus(data){
  currentStatus = data.status;
}

// 책 정보 출력
function handleBook(data) {
  if(data.error){ alert("책 없음"); return; }

  currentBook = data;

  let statusClass = "available";
  let statusText = "대출 가능";

  if(currentStatus === "대출"){
    statusClass = "borrowed";
    statusText = "대출중";
  }

  document.getElementById("bookArea").innerHTML = `
    <div class="book-card">
      <img src="${data.cover}" class="book-img">
      <div>
        <div class="book-title">${data.title}</div>
        <div>${data.author}</div>
        <div>${data.publisher}</div>
        <div class="status ${statusClass}">${statusText}</div>
      </div>
    </div>
  `;
}

// 👤 회원가입
function register() {
  const name = document.getElementById("userName").value;
  const phone = document.getElementById("userPhone").value;

  const s = document.createElement("script");
  s.src = API_URL +
    "?action=register&name="+encodeURIComponent(name)+
    "&phone="+phone+
    "&callback=handleRegister";
  document.body.appendChild(s);
}

function handleRegister(data){
  if(data.error){ alert(data.error); return; }
  alert("가입 완료");
  loadUsers();
}

// 👤 회원 목록
function loadUsers() {
  const s = document.createElement("script");
  s.src = API_URL + "?action=getUsers&callback=handleUsers";
  document.body.appendChild(s);
}

function handleUsers(data) {
  const select = document.getElementById("userSelect");
  select.innerHTML = "";

  data.users.forEach(u => {
    const opt = document.createElement("option");
    opt.value = u.name;
    opt.text = u.name + " (" + u.phone + ")";
    select.appendChild(opt);
  });
}

// 📦 대출
function borrow() {
  if(!currentBook){ alert("책 먼저 조회"); return; }

  if(currentStatus === "대출"){
    alert("이미 대출중");
    return;
  }

  const name = document.getElementById("userSelect").value;
  const isbn = document.getElementById("isbn").value;

  const s = document.createElement("script");
  s.src = API_URL +
    "?action=borrow&name="+encodeURIComponent(name)+
    "&isbn="+isbn+
    "&title="+encodeURIComponent(currentBook.title)+
    "&callback=handleBorrow";
  document.body.appendChild(s);
}

function handleBorrow(data){
  if(data.error){ alert(data.error); return; }
  alert("대출 완료");
  getBook();
}

// 📥 반납
function returnBook() {
  const isbn = document.getElementById("isbn").value;

  const s = document.createElement("script");
  s.src = API_URL +
    "?action=return&isbn="+isbn+
    "&callback=handleReturn";
  document.body.appendChild(s);
}

function handleReturn(data){
  if(data.error){ alert(data.error); return; }
  alert("반납 완료");
  getBook();
}

// 초기 로딩
loadUsers();
</script>

</body>
</html>
