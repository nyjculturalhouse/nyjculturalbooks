<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: 'Pretendard', sans-serif; }
    .book-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; align-items: center; }
    .book-cover { width: 60px; height: 90px; object-fit: cover; border-radius: 4px; margin-right: 15px; background: #eee; }
    .nav-pills .nav-link.active { background-color: #2c3e50; }
  </style>
</head>
<body>

<div class="container py-4">
  <h2 class="text-center mb-4">🏠 문화의집 소소책방</h2>

  <ul class="nav nav-pills nav-fill mb-4" id="pills-tab" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-list" onclick="loadBooks()">도서목록</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-join">회원가입</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-admin">도서등록</button></li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="tab-list">
      <div id="bookListArea">목록을 불러오는 중...</div>
    </div>

    <div class="tab-pane fade" id="tab-join">
      <div class="card p-4">
        <input type="text" id="uId" class="form-control mb-2" placeholder="아이디">
        <input type="text" id="uName" class="form-control mb-2" placeholder="이름">
        <input type="text" id="uPhone" class="form-control mb-3" placeholder="전화번호">
        <button class="btn btn-primary w-100" onclick="signUp()">가입하기</button>
      </div>
    </div>

    <div class="tab-pane fade" id="tab-admin">
      <div class="card p-4">
        <input type="text" id="bTitle" class="form-control mb-2" placeholder="제목">
        <input type="text" id="bIsbn" class="form-control mb-3" placeholder="ISBN (표지 자동 로드)">
        <button class="btn btn-dark w-100" onclick="regBook()">등록하기</button>
      </div>
    </div>
  </div>
</div>

<script>
  window.onload = loadBooks;

  function loadBooks() {
    google.script.run.withSuccessHandler(books => {
      const area = document.getElementById('bookListArea');
      if (books.length === 0) {
        area.innerHTML = "<p class='text-center text-muted'>책이 없습니다. 먼저 등록해주세요.</p>";
        return;
      }
      area.innerHTML = books.map(b => `
        <div class="book-card">
          <img src="${b[6] || 'https://via.placeholder.com/60x90'}" class="book-cover">
          <div>
            <div class="fw-bold">${b[0]}</div>
            <div class="small text-muted">${b[1]} | ${b[4]}</div>
            <span class="badge ${b[5] === '대여 가능' ? 'bg-success' : 'bg-danger'} mt-1">${b[5]}</span>
          </div>
        </div>
      `).join('');
    }).getBooks();
  }

  function signUp() {
    const data = { id: document.getElementById('uId').value, name: document.getElementById('uName').value, phone: document.getElementById('uPhone').value };
    google.script.run.withSuccessHandler(res => alert(res.message)).processSignUp(data);
  }

  function regBook() {
    const book = { title: document.getElementById('bTitle').value, isbn: document.getElementById('bIsbn').value };
    google.script.run.withSuccessHandler(() => { alert("등록 완료!"); loadBooks(); }).addBook(book);
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
