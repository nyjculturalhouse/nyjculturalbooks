<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문화의집 소소책방</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding: 20px; font-family: 'Pretendard', sans-serif; }
    .book-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; display: flex; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .book-cover { width: 65px; height: 95px; object-fit: cover; margin-right: 15px; border-radius: 6px; background: #eee; }
    .nav-pills .nav-link.active { background-color: #2c3e50; }
  </style>
</head>
<body>
  <div class="container" style="max-width: 600px;">
    <h2 class="text-center my-4"> 문화의집 소소책방</h2>
    
    <ul class="nav nav-pills nav-fill mb-4" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-list" onclick="loadBooks()">도서목록</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-join">회원가입</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-admin">도서등록</button></li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="tab-list">
        <div id="listArea" class="text-center p-4 text-muted">로딩 중...</div>
      </div>

      <div class="tab-pane fade" id="tab-join">
        <div class="card p-4 shadow-sm">
          <input type="text" id="uId" class="form-control mb-2" placeholder="아이디">
          <input type="text" id="uName" class="form-control mb-2" placeholder="이름">
          <input type="text" id="uPhone" class="form-control mb-3" placeholder="전화번호">
          <button class="btn btn-primary w-100" onclick="signUp()">가입하기</button>
        </div>
      </div>

      <div class="tab-pane fade" id="tab-admin">
        <div class="card p-4 shadow-sm">
          <input type="text" id="bTitle" class="form-control mb-2" placeholder="도서 제목">
          <input type="text" id="bIsbn" class="form-control mb-3" placeholder="ISBN (표지 자동 불러오기)">
          <button class="btn btn-dark w-100" onclick="regBook()">도서 등록</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /**
     * 구글 라이브러리 로드 대기 및 도서 목록 호출
     */
    function loadBooks() {
      const area = document.getElementById('listArea');
      // google 객체가 로드되지 않았으면 0.5초 후 재시도
      if (typeof google === 'undefined' || !google.script) {
        setTimeout(loadBooks, 500);
        return;
      }

      google.script.run.withSuccessHandler(books => {
        if (!books || books.length === 0) {
          area.innerHTML = "<p class='p-5'>등록된 도서가 없습니다.</p>";
          return;
        }
        area.innerHTML = books.map(b => `
          <div class="book-card">
            <img src="${b[6] || 'https://via.placeholder.com/65x95?text=No+Image'}" class="book-cover">
            <div class="text-start">
              <div class="fw-bold" style="font-size: 1.1rem;">${b[0]}</div>
              <div class="text-muted small">${b[1] || '저자 미상'} | ${b[4] || '기타'}</div>
              <span class="badge ${b[5] === '대여 가능' ? 'bg-success' : 'bg-danger'} mt-2">${b[5]}</span>
            </div>
          </div>
        `).join('');
      }).getBooks();
    }

    // 첫 페이지 로드 시 도서 목록 로딩
    window.onload = loadBooks;

    function signUp() {
      const data = { 
        id: document.getElementById('uId').value, 
        name: document.getElementById('uName').value, 
        phone: document.getElementById('uPhone').value 
      };
      if (!data.id) return alert("아이디를 입력하세요.");
      google.script.run.withSuccessHandler(res => {
        alert(res.message);
        if(res.success) location.reload();
      }).processSignUp(data);
    }

    function regBook() {
      const title = document.getElementById('bTitle').value;
      const isbn = document.getElementById('bIsbn').value;
      if (!title || !isbn) return alert("제목과 ISBN을 입력하세요.");
      
      google.script.run.withSuccessHandler(() => {
        alert("도서가 등록되었습니다!");
        location.reload();
      }).addBook({ title: title, isbn: isbn });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
