<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소소책방 도서관리</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header class="main-header">
            <h1>남양주시 문화의집</h1>
            <h2 class="sub-title">소소책방</h2>
        </header>

        <nav id="main-menu">
            <button onclick="window.app.render('search')" class="menu-btn orange">도서찾기</button>
            <button onclick="window.app.render('join')" class="menu-btn blue">회원가입</button>
            <button onclick="window.app.render('login')" class="menu-btn green">대여/반납</button>
        </nav>

        <main id="content-view"></main>

        <button id="home-btn" class="hidden" onclick="location.reload()">처음으로 돌아가기</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
