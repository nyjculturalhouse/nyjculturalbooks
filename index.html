<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #f8f9fa; font-family: 'Pretendard', sans-serif; }
    .container { max-width: 900px; margin-top: 50px; }
    .card { border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: none; }
    .book-img { width: 80px; height: 110px; object-fit: cover; border-radius: 5px; }
    .nav-tabs .nav-link { color: #495057; font-weight: bold; }
    .nav-tabs .nav-link.active { color: #0d6efd; border-bottom: 3px solid #0d6efd; }
  </style>
</head>
<body>

<div class="container">
  <div class="text-center mb-4">
    <h2>BrightLight Library</h2>
    <p class="text-muted">도서 대출 관리 시스템</p>
  </div>

  <ul class="nav nav-tabs mb-4" id="libTab" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#signup">회원가입</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#bookList">도서목록</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#admin">도서등록(관리자)</button></li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="signup">
      <div class="card p-4">
        <h4>회원 가입</h4>
        <div class="mb-3"><input type="text" id="regId" class="form-control" placeholder="아이디"></div>
        <div class="mb-3"><input type="text" id="regName" class="form-control" placeholder="이름"></div>
        <div class="mb-3"><input type="text" id="regPhone" class="form-control" placeholder="전화번호"></div>
        <button onclick="signUp()" class="btn btn-primary w-100">가입하기</button>
      </div>
    </div>

    <div class="tab-pane fade" id="bookList">
      <div class="card p-4">
        <button onclick="loadBooks()" class="btn btn-outline-secondary mb-3">새로고침</button>
        <div id="bookDisplay"></div>
      </div>
    </div>

    <div class="tab-pane fade" id="admin">
      <div class="card p-4">
        <h4>새 도서 등록</h4>
        <input type="text" id="bTitle" class="form-control mb-2" placeholder="도서명">
        <input type="text" id="bAuthor" class="form-control mb-2" placeholder="저자">
        <input type="text" id="bPub" class="form-control mb-2" placeholder="출판사">
        <input type="text" id="bIsbn" class="form-control mb-2" placeholder="ISBN (13자리)">
        <select id="bCat" class="form-select mb-3">
          <option value="소설">소설</option>
          <option value="프로그래밍">프로그래밍</option>
          <option value="인문">인문</option>
        </select>
        <button onclick="regBook()" class="btn btn-dark w-100">등록하기</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function signUp() {
    const data = {
      id: document.getElementById('regId').value,
      name: document.getElementById('regName').value,
      phone: document.getElementById('regPhone').value
    };
    google.script.run.withSuccessHandler(res => alert(res.message)).processSignUp(data);
  }

  function regBook() {
    const book = {
      title: document.getElementById('bTitle').value,
      author: document.getElementById('bAuthor').value,
      publisher: document.getElementById('bPub').value,
      isbn: document.getElementById('bIsbn').value,
      category: document.getElementById('bCat').value
    };
    google.script.run.withSuccessHandler(() => alert("등록 완료!")).addBook(book);
  }

  function loadBooks() {
    google.script.run.withSuccessHandler(books => {
      const display = document.getElementById('bookDisplay');
      display.innerHTML = books.map(b => `
        <div class="d-flex align-items-center border-bottom py-3">
          <img src="${b[6] || 'https://via.placeholder.com/80x110'}" class="book-img me-3">
          <div>
            <h6 class="mb-1">${b[0]}</h6>
            <small class="text-muted">${b[1]} | ${b[4]}</small><br>
            <span class="badge ${b[5] === '대여 가능' ? 'bg-success' : 'bg-danger'}">${b[5]}</span>
          </div>
        </div>
      `).join('');
    }).getBooks();
  }
</script>
</body>
</html>
