<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>도서 대출 시스템</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #eef1f5;
  margin: 0;
}

/* 상단 바 */
.header {
  background: #2c3e50;
  color: white;
  padding: 20px;
  font-size: 24px;
  font-weight: bold;
}

/* 전체 레이아웃 */
.container {
  max-width: 1100px;
  margin: 30px auto;
}

/* 카드 */
.card {
  background: white;
  border-radius: 12px;
  padding: 30px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

/* 입력 영역 */
.input-row {
  display: flex;
  gap: 10px;
}

.input-row input {
  flex: 1;
  padding: 15px;
  font-size: 16px;
}

.input-row button {
  width: 150px;
  font-size: 16px;
}

/* 도서 영역 */
.book-area {
  display: flex;
  gap: 40px;
  margin-top: 30px;
  align-items: center;
}

/* 이미지 */
.book-img {
  width: 220px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

/* 텍스트 */
.book-info {
  flex: 1;
}

.book-title {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 10px;
}

/* 버튼 영역 */
.action-row {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.action-row button {
  flex: 1;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
}

/* 버튼 스타일 */
.btn-blue {
  background: #3498db;
  color: white;
  border: none;
}

.btn-green {
  background: #2ecc71;
  color: white;
  border: none;
}

.btn-red {
  background: #e74c3c;
  color: white;
  border: none;
}

button {
  border-radius: 8px;
  cursor: pointer;
}

</style>
</head>

<body>

<div class="header">
  📚 도서관 대출 관리 시스템
</div>

<div class="container">
  <div class="card">

    <!-- ISBN 입력 -->
    <div class="input-row">
      <input id="isbn" placeholder="바코드 스캔 또는 ISBN 입력">
      <button class="btn-blue" onclick="getBook()">도서 조회</button>
    </div>

    <!-- 도서 정보 -->
    <div id="bookInfo" class="book-area"></div>

    <!-- 사용자 -->
    <input id="name" placeholder="이름 입력" style="margin-top:20px; padding:15px; width:100%; font-size:16px;">

    <!-- 버튼 -->
    <div class="action-row">
      <button class="btn-green" onclick="borrow()">대출</button>
      <button class="btn-red" onclick="returnBook()">반납</button>
    </div>

  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzKZsphyic_EsPpABC1VaBhEmVppWeIuCIRatHIDeaYb4P8zG_q9MngtyTGIXkRm8IP/exec";

let currentBook = null;

// 엔터 조회
document.getElementById("isbn").addEventListener("keypress", function(e){
  if (e.key === "Enter") getBook();
});

// 📚 조회
function getBook() {
  const isbn = document.getElementById("isbn").value;

  const script = document.createElement("script");
  script.src = API_URL +
    "?action=getBook" +
    "&isbn=" + isbn +
    "&callback=handleBook";

  document.body.appendChild(script);
}

// 📚 결과 표시
function handleBook(data) {
  if (data.error) {
    alert("책 없음");
    return;
  }

  currentBook = data;

  document.getElementById("bookInfo").innerHTML = `
    <img src="${data.cover}" class="book-img">
    <div class="book-info">
      <div class="book-title">${data.title}</div>
      <div>${data.author}</div>
      <div>${data.publisher}</div>
    </div>
  `;
}

// 📦 대출
function borrow() {
  const name = document.getElementById("name").value;
  const isbn = document.getElementById("isbn").value;

  if (!currentBook) {
    alert("도서 먼저 조회");
    return;
  }

  const script = document.createElement("script");
  script.src = API_URL +
    "?action=borrow" +
    "&name=" + encodeURIComponent(name) +
    "&isbn=" + isbn +
    "&title=" + encodeURIComponent(currentBook.title) +
    "&callback=handleBorrow";

  document.body.appendChild(script);
}

function handleBorrow(data) {
  if (data.error) {
    alert(data.error);
    return;
  }

  alert("대출 완료");
}

// 📥 반납
function returnBook() {
  const isbn = document.getElementById("isbn").value;

  const script = document.createElement("script");
  script.src = API_URL +
    "?action=return" +
    "&isbn=" + isbn +
    "&callback=handleReturn";

  document.body.appendChild(script);
}

function handleReturn(data) {
  if (data.error) {
    alert(data.error);
    return;
  }

  alert("반납 완료");
}
</script>

</body>
</html>
