<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문화의집 소소책방 도서 대여 프로그램 - 로그인</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo-area">
                <h1>소소책방 도서 대여 프로그램</h1>
                <p>로그인하여 서비스를 이용하세요</p>
            </div>
            
            <!-- id="loginForm"은 유지하되, 내부 버튼의 submit 동작을 제어합니다 -->
            <form id="loginForm" class="auth-form" onsubmit="return false;">
                <div class="form-group">
                    <label for="userId">아이디</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="userId" name="userId" required placeholder="아이디를 입력하세요">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" required placeholder="비밀번호를 입력하세요">
                    </div>
                </div>
                
                <!-- type="submit"에서 type="button"으로 변경하여 중복 실행 방지 -->
                <button type="button" id="btnLogin" class="btn-primary" style="width: 100%;">로그인</button>
            </form>
            
            <div class="auth-links">
                <span>계정이 없으신가요?</span>
                <a href="signup.html">회원가입</a>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>

    <script>
        window.onload = function() {
            // 버튼 클릭 이벤트 강제 연결 (auth.js와 충돌 방지 및 확실한 실행)
            const btn = document.getElementById('btnLogin');
            if (btn) {
                btn.onclick = function() {
                    // auth.js에 정의된 로그인 함수가 있다면 여기서 호출하거나,
                    // 기본적으로 auth.js가 loginForm의 이벤트를 잡도록 설계되어 있다면 
                    // 아래와 같이 이벤트를 수동으로 발생시킬 수 있습니다.
                    const form = document.getElementById('loginForm');
                    form.dispatchEvent(new Event('submit'));
                };
            }

            if (typeof window.GAS_URL === 'undefined') {
                console.error("GAS_URL 로드 실패");
            } else {
                console.log("준비 완료:", window.GAS_URL);
            }
        };
    </script>
</body>
</html>
