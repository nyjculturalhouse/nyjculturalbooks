<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문화의집 소소책방 도서 대여 프로그램 - 로그인</title>
    <!-- CSS 파일 경로가 정확한지 다시 한번 확인하세요 -->
    <link rel="stylesheet" href="css/style.css">
    <!-- 아이콘 폰트 추가 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo-area">
                <h1>소소책방 도서 대여 프로그램</h1>
                <p>로그인하여 서비스를 이용하세요</p>
            </div>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="userId">아이디</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="userId" required placeholder="아이디를 입력하세요">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" required placeholder="비밀번호를 입력하세요">
                    </div>
                </div>
                
                <!-- w-100 클래스는 style.css의 btn-primary 스타일을 확장하여 적용됩니다 -->
                <button type="submit" class="btn-primary" style="width: 100%;">로그인</button>
            </form>
            
            <div class="auth-links">
                <span>계정이 없으신가요?</span>
                <a href="signup.html">회원가입</a>
            </div>
        </div>
    </div>

    <!-- 알림 메시지 출력을 위한 컨테이너 (style.css에서 정중앙 배치 설정됨) -->
    <div id="toastContainer"></div>

    <!-- 자바스크립트 로드 순서: 전역변수(app) -> 통신(api) -> 화면(ui) -> 기능(auth) -->
    <script src="js/app.js"></script> 
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // 페이지 로드 상태 및 설정값 확인
        window.onload = function() {
            console.log("현재 접속 경로:", window.location.href);
            // GAS_URL은 app.js에서 정의되어야 합니다.
            if (typeof window.GAS_URL === 'undefined') {
                console.error("오류: app.js 로드 실패. js 폴더 구조와 파일명을 확인하세요.");
            } else {
                console.log("API 설정 로드 완료:", window.GAS_URL);
            }
        };
    </script>
</body>
</html>
