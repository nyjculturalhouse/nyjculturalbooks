<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>도서 대출 시스템</title>

<style>
body { font-family: Arial; background:#f2f4f6; }
.container { max-width:500px; margin:auto; padding:20px; }
.card { background:white; padding:20px; border-radius:10px; }
input, button {
  width:100%; padding:10px; margin-top:10px;
}
img { width:100px; margin-top:10px; }
</style>
</head>

<body>
<div class="container">
  <div class="card">
    <h2>📚 도서 대출 시스템</h2>

    <input id="isbn" placeholder="바코드 찍기 (ISBN)">
    <button onclick="getBook()">도서 조회</button>

    <div id="bookInfo"></div>

    <input id="name" placeholder="이름 입력">

    <button onclick="borrow()">대출하기</button>
    <button onclick="returnBook()">반납하기</button>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzKZsphyic_EsPpABC1VaBhEmVppWeIuCIRatHIDeaYb4P8zG_q9MngtyTGIXkRm8IP/exec";

let currentBook = null;

// 엔터 자동 조회
document.getElementById("isbn").addEventListener("keypress", function(e){
  if (e.key === "Enter") {
    getBook();
  }
});

// 📚 도서 조회 (JSONP)
function getBook() {
  const isbn = document.getElementById("isbn").value;

  const script = document.createElement("script");
  script.src = API_URL +
    "?action=getBook" +
    "&isbn=" + isbn +
    "&callback=handleBook";

  document.body.appendChild(script);
}

// 📚 조회 결과 처리
function handleBook(data) {
  if (data.error) {
    alert("책 없음");
    return;
  }

  currentBook = data;

document.getElementById("bookInfo").innerHTML = `
  <div class="book-box">
    <img src="${data.cover}" class="book-img">
    <div class="book-text">
      <p class="book-title">${data.title}</p>
      <p>${data.author}</p>
    </div>
  </div>
`;
}

// 📦 대출 (JSONP)
function borrow() {
  const name = document.getElementById("name").value;
  const isbn = document.getElementById("isbn").value;

  if (!currentBook) {
    alert("먼저 도서 조회");
    return;
  }

  const script = document.createElement("script");
  script.src = API_URL +
    "?action=borrow" +
    "&name=" + encodeURIComponent(name) +
    "&isbn=" + isbn +
    "&title=" + encodeURIComponent(currentBook.title) +
    "&callback=handleBorrow";

  document.body.appendChild(script);
}

function handleBorrow(data) {
  if (data.error) {
    alert(data.error);
    return;
  }

  alert("대출 완료");
}

// 📥 반납 (JSONP)
function returnBook() {
  const isbn = document.getElementById("isbn").value;

  const script = document.createElement("script");
  script.src = API_URL +
    "?action=return" +
    "&isbn=" + isbn +
    "&callback=handleReturn";

  document.body.appendChild(script);
}

function handleReturn(data) {
  if (data.error) {
    alert(data.error);
    return;
  }

  alert("반납 완료");
}
</script>

</body>
</html>
