<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 대출 관리 시스템 - 로그인</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="logo-area">
            <h2>도서관리시스템</h2>
            <p>로그인하여 서비스를 이용하세요</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label for="userId">아이디</label>
                <input type="text" id="userId" required placeholder="아이디를 입력하세요">
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" required placeholder="비밀번호를 입력하세요">
            </div>
            <button type="submit" class="btn-primary w-100">로그인</button>
        </form>
        <div class="auth-links">
            <span>계정이 없으신가요?</span>
            <a href="signup.html">회원가입</a>
        </div>
    </div>
    
<!-- 반드시 app.js가 1번이어야 합니다! -->
<script src="js/app.js"></script> 
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
