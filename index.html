<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문화의집 소소책방 도서 대여 프로그램 - 로그인</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=book" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <style>
        /* 프리텐다드 폰트 적용 및 300(Light) 가중치 적용 */
        body, input, button, a {
            font-family: 'Pretendard', sans-serif !important;
            font-weight: 300;
        }

        .auth-body {
            background-color: #F5F3EE;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .auth-card {
            width: 100%;
            max-width: 1200px;
            background: #FFFFFF;
            border-radius: 16px;
            border: 1px solid #E6E2D8;
            box-shadow: 0 4px 20px rgba(44, 38, 33, 0.02);
            padding: 50px 40px;
            box-sizing: border-box;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #E6E2D8;
            padding-bottom: 25px;
        }
        
        .logo-area h2 {
            font-size: 28px;
            color: #2C2621;
            font-weight: 300; /* 폰트 가중치 300 */
            margin: 0 0 10px 0;
        }

        /* Material Symbols 로고 스타일 */
        .logo-area .material-symbols-outlined {
            font-size: 40px;
            color: #FF5A36;
            vertical-align: middle;
            margin-right: 8px;
        }

        .logo-area p { font-size: 15px; color: #8C8276; margin: 0 0 15px 0; }

        .login-guide {
            display: inline-block;
            background-color: #FFF5F2;
            color: #FF5A36;
            border: 1px solid #FF5A36;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px !important;
            font-weight: 400;
        }

        .form-group { margin-bottom: 24px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 400; color: #2C2621; font-size: 14px; }

        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 16px; color: #8C8276; font-size: 16px; }
        .input-wrapper input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border: 1px solid #E6E2D8;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            font-size: 14px;
            color: #2C2621;
            transition: border-color 0.2s;
        }
        .input-wrapper input:focus { border-color: #FF5A36; }

        .auth-button-group { display: flex; gap: 12px; margin-top: 35px; }
        .btn-primary {
            flex: 1;
            background-color: #FF5A36;
            border: none;
            color: white;
            height: 50px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 400;
            font-size: 15px;
            transition: background-color 0.2s;
        }
        .btn-secondary-custom {
            flex: 1;
            background-color: transparent;
            color: #8C8276;
            border: 1px solid #E6E2D8;
            height: 50px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: 400;
            transition: all 0.2s;
        }
    </style>
</head>

<body class="auth-body">
    <div class="auth-card">
        <div class="logo-area">
            <h2><span class="material-symbols-outlined">book</span> 소소책방 도서 대여 프로그램</h2>
            <p>로그인하여 서비스를 이용하세요</p>
            <p class="login-guide">
                <i class="fas fa-info-circle"></i> 비밀번호는 회원가입 시 입력한 전화번호 뒤 4자리입니다.
            </p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="userId">아이디</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="userId" required placeholder="아이디를 입력하세요">
                </div>
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" required placeholder="비밀번호를 입력하세요">
                </div>
            </div>
            <div class="auth-button-group">
                <button type="submit" class="btn-primary">로그인</button>
                <a href="signup.html" class="btn-secondary-custom">회원가입</a>
            </div>
        </form>
    </div>

    <div id="toastContainer"></div>

    <div id="loginErrorModal" style="
        position: fixed;
        top: -100px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #FF5A36; /* 소소책방 고유 오렌지 톤 */
        color: #FFFFFF;
        padding: 14px 28px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(255, 90, 54, 0.25);
        font-size: 14px;
        font-weight: 400;
        display: flex;
        align-items: center;
        gap: 10px;
        letter-spacing: -0.5px;
        z-index: 10000;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        opacity: 0;
    ">
        <i class="fas fa-exclamation-circle"></i>
        <span id="loginErrorMessage">정보가 올바르지 않습니다.</span>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>

    <script>
        window.showIndexModal = function(message) {
            // "확인 중", "처리 중" 같은 불필요한 중간 안내 멘트는 화면에 띄우지 않고 아예 무시합니다.
            if (message.includes('확인 중') || message.includes('처리 중')) {
                return;
            }

            const modal = document.getElementById('loginErrorModal');
            const modalText = document.getElementById('loginErrorMessage');
            
            if (!modal || !modalText) return;

            // 실패 원인 메시지 적용 ("아이디 없음", "비밀번호 실패" 등)
            modalText.innerText = message;

            // 상단에서 아래로 부드럽게 스르륵 내려오며 나타나기
            modal.style.top = '30px';
            modal.style.opacity = '1';

            // 2.8초 동안 보여준 뒤 자동으로 다시 위로 숨기기
            setTimeout(() => {
                modal.style.top = '-100px';
                modal.style.opacity = '0';
            }, 2800);
        };
    </script>
</body>
</html>
