<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>문화의집 소소책방</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="loadingOverlay" class="loading-overlay d-none">
  <div class="spinner-border text-light"></div>
</div>

<div class="container py-5">

  <!-- 로그인 -->
  <section id="loginSection">

    <div class="auth-card mx-auto">

      <h1 class="main-title">문화의집 소소책방</h1>

      <input type="text" id="loginId" class="form-control mb-3" placeholder="아이디">

      <input type="password" id="loginPw" class="form-control mb-3" placeholder="비밀번호">

      <button class="btn btn-main w-100 mb-3" onclick="login()">
        로그인
      </button>

      <button class="btn btn-outline-secondary w-100" onclick="showSection('signupSection')">
        회원가입
      </button>

    </div>

  </section>

  <!-- 회원가입 -->
  <section id="signupSection" class="d-none">

    <div class="auth-card mx-auto">

      <h2 class="section-title">회원가입</h2>

      <input type="text" id="signupId" class="form-control mb-3" placeholder="아이디">

      <input type="password" id="signupPw" class="form-control mb-2" placeholder="비밀번호">

      <input type="password" id="signupPw2" class="form-control mb-2" placeholder="비밀번호 확인" onkeyup="checkPasswordMatch()">

      <small id="pwCheckText"></small>

      <input type="text" id="signupName" class="form-control mb-3 mt-3" placeholder="이름">

      <input type="text" id="signupPhone" class="form-control mb-3" placeholder="전화번호">

      <button class="btn btn-main w-100 mb-3" onclick="signup()">
        회원가입
      </button>

      <button class="btn btn-outline-secondary w-100" onclick="showSection('loginSection')">
        로그인으로
      </button>

    </div>

  </section>

  <!-- 사용자 -->
  <section id="userSection" class="d-none">

    <div class="d-flex justify-content-between align-items-center mb-4">

      <div>
        <h2 class="section-title mb-1">안녕하세요 👋</h2>
        <div id="welcomeText"></div>
      </div>

      <span class="badge bg-success fs-6" id="rentalCountBadge">
        대여 0권
      </span>

    </div>

    <div class="sticky-search">

      <input type="text" class="form-control" id="searchInput" placeholder="도서 검색..." onkeyup="loadBooks()">

    </div>

    <div class="menu-wrap">

      <button class="btn btn-main" onclick="showUserTab('booksTab')">도서 검색</button>

      <button class="btn btn-main" onclick="loadMyRentals()">내 대여</button>

      <button class="btn btn-main" onclick="showUserTab('profileTab')">내 정보</button>

      <button class="btn btn-outline-danger" onclick="logout()">로그아웃</button>

    </div>

    <div id="booksTab">
      <div class="row" id="bookList"></div>
    </div>

    <div id="rentalsTab" class="d-none">
      <div class="row" id="rentalList"></div>
    </div>

    <div id="profileTab" class="d-none">

      <div class="profile-card">

        <div class="profile-icon">👤</div>

        <input type="text" id="profileName" class="form-control mb-3">

        <input type="password" id="profilePw" class="form-control mb-3" placeholder="새 비밀번호">

        <button class="btn btn-main w-100 mb-3" onclick="updateProfile()">
          수정하기
        </button>

        <button class="btn btn-outline-danger w-100" onclick="deleteUser()">
          회원 탈퇴
        </button>

      </div>

    </div>

  </section>

</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="mainToast" class="toast">
    <div class="toast-body" id="toastBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="app.js"></script>

</body>
</html>
