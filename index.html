<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>스마트 라이브러리 UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>소소책방 도서관리 시스템</h1>
    </header>

    <div class="container">
        <div id="view-main">
            <div class="card">
                <h2>환영합니다</h2>
                <button id="nav-search" class="btn">도서 검색</button>
                <button id="nav-mypage" class="btn btn-point">마이페이지</button>
            </div>
        </div>

        <div id="view-mypage" class="hidden">
            <div class="card status-highlight">
                <h2 id="user-welcome">님, 반갑습니다.</h2>
                <p>나의 대여 현황 및 독서 통계 리포트입니다. [cite: 12]</p>
            </div>
            
            <div class="card">
                <h3>장르별 독서 분포 [cite: 33]</h3>
                <div id="stats-area"></div>
            </div>

            <div class="card">
                <h3>현재 대여 중인 도서 [cite: 31]</h3>
                <div id="current-rentals"></div>
            </div>

            <button id="btn-back-home" class="btn">처음으로</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
