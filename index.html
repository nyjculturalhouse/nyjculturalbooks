<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>도서 대출 시스템</title>

<style>
* { box-sizing: border-box; }

body {
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: #f7f9fc;
}

/* 상단 */
.header {
  background: linear-gradient(135deg, #4f46e5, #6366f1);
  color: white;
  padding: 20px 40px;
  font-size: 22px;
  font-weight: bold;
}

/* 전체 */
.container {
  max-width: 1200px;
  margin: 30px auto;
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 20px;
}

/* 카드 */
.card {
  background: white;
  border-radius: 16px;
  padding: 25px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

/* 입력 */
.input-group {
  display: flex;
  gap: 10px;
}

.input-group input {
  flex: 1;
  padding: 16px;
  font-size: 16px;
  border: 1px solid #ddd;
  border-radius: 10px;
}

.input-group button {
  width: 140px;
}

/* 버튼 */
button {
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
}

.btn-primary {
  background: #4f46e5;
  color: white;
}

.btn-green {
  background: #22c55e;
  color: white;
}

.btn-red {
  background: #ef4444;
  color: white;
}

/* 책 카드 */
.book-card {
  display: flex;
  gap: 20px;
  margin-top: 20px;
}

.book-img {
  width: 160px;
  border-radius: 10px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.1);
}

.book-info {
  flex: 1;
}

.book-title {
  font-size: 20px;
  font-weight: bold;
}

.status {
  margin-top: 10px;
  padding: 6px 12px;
  display: inline-block;
  border-radius: 20px;
  font-size: 13px;
}

.available { background:#dcfce7; color:#166534; }
.borrowed { background:#fee2e2; color:#991b1b; }

/* 사이드 */
.side-card input {
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ddd;
}

.action-btns {
  display:flex;
  gap:10px;
  margin-top:20px;
}

.action-btns button {
  flex:1;
  padding:14px;
}

</style>
</head>

<body>

<div class="header">📚 도서관 대출 시스템</div>

<div class="container">

  <!-- 왼쪽 -->
  <div class="card">
    <div class="input-group">
      <input id="isbn" placeholder="ISBN 또는 바코드 스캔">
      <button class="btn-primary" onclick="getBook()">조회</button>
    </div>

    <div id="bookArea"></div>
  </div>

  <!-- 오른쪽 -->
  <div class="card side-card">
    <h3>대출 정보</h3>

    <input id="name" placeholder="이름 입력">

    <div class="action-btns">
      <button class="btn-green" onclick="borrow()">대출</button>
      <button class="btn-red" onclick="returnBook()">반납</button>
    </div>
  </div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzKZsphyic_EsPpABC1VaBhEmVppWeIuCIRatHIDeaYb4P8zG_q9MngtyTGIXkRm8IP/exec";

let currentBook = null;

document.getElementById("isbn").addEventListener("keypress", e => {
  if(e.key==="Enter") getBook();
});

function getBook() {
  const isbn = document.getElementById("isbn").value;

  const s = document.createElement("script");
  s.src = API_URL + "?action=getBook&isbn="+isbn+"&callback=handleBook";
  document.body.appendChild(s);
}

function handleBook(data) {
  if(data.error){ alert("책 없음"); return; }

  currentBook = data;

  document.getElementById("bookArea").innerHTML = `
    <div class="book-card">
      <img src="${data.cover}" class="book-img">
      <div class="book-info">
        <div class="book-title">${data.title}</div>
        <div>${data.author}</div>
        <div>${data.publisher}</div>
        <div class="status available">대출 가능</div>
      </div>
    </div>
  `;
}

function borrow() {
  if(!currentBook){ alert("책 먼저 조회"); return; }

  const name = document.getElementById("name").value;
  const isbn = document.getElementById("isbn").value;

  const s = document.createElement("script");
  s.src = API_URL +
    "?action=borrow&name="+encodeURIComponent(name)+
    "&isbn="+isbn+
    "&title="+encodeURIComponent(currentBook.title)+
    "&callback=handleBorrow";
  document.body.appendChild(s);
}

function handleBorrow(data){
  if(data.error){ alert(data.error); return; }
  alert("대출 완료");
}

function returnBook() {
  const isbn = document.getElementById("isbn").value;

  const s = document.createElement("script");
  s.src = API_URL +
    "?action=return&isbn="+isbn+
    "&callback=handleReturn";
  document.body.appendChild(s);
}

function handleReturn(data){
  if(data.error){ alert(data.error); return; }
  alert("반납 완료");
}
</script>

</body>
</html>
