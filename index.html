<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>도서관리 시스템</title>

<style>
body { font-family:'Noto Sans KR'; background:#f2f4f6; margin:0; }

.header {
  background:#658dc6;
  color:white;
  padding:20px;
  font-size:22px;
}

.tabs {
  display:flex;
  background:white;
  border-bottom:1px solid #ddd;
}

.tab {
  padding:15px 25px;
  cursor:pointer;
}

.tab.active {
  border-bottom:3px solid #658dc6;
  font-weight:bold;
}

.container { padding:30px; }

.card {
  background:white;
  padding:20px;
  border-radius:10px;
  margin-bottom:20px;
}

input, select {
  padding:10px;
  margin:5px;
}

button {
  background:#658dc6;
  color:white;
  border:none;
  padding:10px 15px;
  border-radius:5px;
  cursor:pointer;
}

.status-가능 { color:green; }
.status-대출중 { color:red; }

</style>
</head>

<body>

<div class="header">📚 도서 관리 시스템</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('books')">도서목록</div>
  <div class="tab" onclick="showTab('borrow')">도서대출</div>
  <div class="tab" onclick="showTab('register')">회원가입</div>
</div>

<div class="container">

<!-- 도서목록 -->
<div id="books">
  <input placeholder="검색" onkeyup="searchBook(this.value)">
  <div id="bookList"></div>
</div>

<!-- 대출 -->
<div id="borrow" style="display:none;">
  <select id="userSelect"></select><br>
  <input id="isbn" placeholder="ISBN"><br>
  <button onclick="borrow()">대출</button>
  <button onclick="returnBook()">반납</button>
</div>

<!-- 회원가입 -->
<div id="register" style="display:none;">
  <input id="name" placeholder="이름"><br>
  <input id="phone" placeholder="전화번호"><br>
  <button onclick="register()">가입</button>
</div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzKZsphyic_EsPpABC1VaBhEmVppWeIuCIRatHIDeaYb4P8zG_q9MngtyTGIXkRm8IP/exec";

let books = [];

function showTab(id){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  event.target.classList.add("active");

  document.getElementById("books").style.display="none";
  document.getElementById("borrow").style.display="none";
  document.getElementById("register").style.display="none";

  document.getElementById(id).style.display="block";
}

function jsonp(url, callback){
  const s = document.createElement("script");
  s.src = url + "&callback=" + callback;
  document.body.appendChild(s);
}

// 📚 도서목록
function loadBooks(){
  jsonp(API+"?action=getBooks", "setBooks");
}

function setBooks(data){
  books = data.books;
  renderBooks(books);
}

function renderBooks(list){
  let html="";
  list.forEach(b=>{
    html += `
      <div class="card">
        <b>${b.title}</b> (${b.category})<br>
        ${b.author} / ${b.publisher}<br>
        ISBN: ${b.isbn}<br>
        <span class="status-${b.status}">${b.status}</span>
      </div>
    `;
  });
  document.getElementById("bookList").innerHTML = html;
}

function searchBook(q){
  renderBooks(books.filter(b=>b.title.includes(q)));
}

// 👤 회원
function loadUsers(){
  jsonp(API+"?action=getUsers", "setUsers");
}

function setUsers(data){
  let sel = document.getElementById("userSelect");
  sel.innerHTML="";
  data.users.forEach(u=>{
    sel.innerHTML += `<option value="${u.name}|${u.phone}">${u.name}</option>`;
  });
}

// 📦 대출
function borrow(){
  const user = document.getElementById("userSelect").value.split("|");
  const isbn = document.getElementById("isbn").value;

  jsonp(API+`?action=borrow&name=${user[0]}&phone=${user[1]}&isbn=${isbn}`, "done");
}

// 📥 반납
function returnBook(){
  const isbn = document.getElementById("isbn").value;
  jsonp(API+`?action=return&isbn=${isbn}`, "done");
}

// 👤 회원가입
function register(){
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;

  jsonp(API+`?action=register&name=${name}&phone=${phone}`, "done");
}

function done(){
  alert("완료");
  loadBooks();
  loadUsers();
}

// 초기 실행
loadBooks();
loadUsers();
</script>

</body>
</html>
