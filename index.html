<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문화의집 소소책방 도서 대여 프로그램 - 로그인</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="logo-area">
            <h2>소소책방 도서 대여 프로그램</h2>
            <p>로그인하여 서비스를 이용하세요</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label for="userId">아이디</label>
                <input type="text" id="userId" required placeholder="아이디를 입력하세요">
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" required placeholder="비밀번호를 입력하세요">
            </div>
            <button type="submit" class="btn-primary w-100">로그인</button>
        </form>
        <div class="auth-links">
            <span>계정이 없으신가요?</span>
            <a href="signup.html">회원가입</a>
        </div>
    </div>
    
<!-- index.html 하단 스크립트 부분 수정 -->

<!-- 1. 주소 설정 파일 (파일이 실제로 js 폴더 안에 있는지 꼭 확인!) -->
<script src="js/app.js"></script> 

<!-- 2. 나머지 로직 -->
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>

<script>
  // 제대로 로드되었는지 브라우저 콘솔에서 확인하기 위한 코드
  window.onload = function() {
    console.log("현재 접속 주소:", window.location.href);
    console.log("설정된 GAS_URL:", window.GAS_URL);
    if (typeof window.GAS_URL === 'undefined') {
      console.error("경고: app.js를 불러오지 못했습니다. 폴더 위치를 확인하세요.");
    }
  };
</script>
</body>
</html>
